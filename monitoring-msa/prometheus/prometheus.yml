global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8081

  - job_name: study-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - study-service:8082

  - job_name: content-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - content-service:8083

  - job_name: calendar-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - calendar-service:8084

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8085

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      # actuator가 라우팅 포트(8080)가 아니라 별도 관리 포트(8090)에 있다
      # (api-gateway application.yml management.server.port 참고).
      - targets:
          - api-gateway:8090

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
