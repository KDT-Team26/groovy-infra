frontend:
  replicaCount: 1
  image:
    repository: khg1115/groovy-frontend
    tag: "msa-v2-arm64"
    pullPolicy: Always
  port: 5173
  # 브라우저가 직접 호출하는 외부 접근 가능 주소라 내부 k8s Service DNS로 유도할 수 없다.
  # Ingress 구축 전까지는 로컬 플레이스홀더로 둔다.
  apiBaseUrl: "http://localhost:8080"

apiGateway:
  replicaCount: 1
  image:
    repository: khg1115/groovy-api-gateway
    tag: "msa-v1"
  port: 8080
  managementPort: 8090 # actuator port로 새로 하나 만들었습니다. - 변

identityService:
  replicaCount: 1
  image:
    repository: khg1115/groovy-identity-service
    tag: "msa-v1"
  port: 8081
  database:
    host: mysql
    port: 3306
    name: identity_db
    username: identity_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"

studyService:
  replicaCount: 1
  image:
    repository: khg1115/groovy-study-service
    tag: "msa-v1"
  port: 8082
  database:
    host: mysql
    port: 3306
    name: study_db
    username: study_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  identityService:
    url: "http://identity-service:8081"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

contentService:
  replicaCount: 1
  image:
    repository: khg1115/groovy-content-service
    tag: "msa-v1"
  port: 8083
  database:
    host: mysql
    port: 3306
    name: content_db
    username: content_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  identityService:
    url: "http://identity-service:8081"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  studyService:
    url: "http://study-service:8082"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

calendarService:
  replicaCount: 1
  image:
    repository: khg1115/groovy-calendar-service
    tag: "msa-v1"
  port: 8084
  database:
    host: mysql
    port: 3306
    name: calendar_db
    username: calendar_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  studyService:
    url: "http://study-service:8082"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

notificationService:
  replicaCount: 1
  image:
    repository: khg1115/groovy-notification-service
    tag: "msa-v1"
  port: 8085
  database:
    host: mysql
    port: 3306
    name: notification_db
    username: notification_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"
    topic: "notification-events"

kafka:
  replicaCount: 1
  image:
    repository: apache/kafka
    tag: "4.3.1"
    pullPolicy: IfNotPresent
  nodeId: 1
  processRoles: "broker,controller"
  clusterId: "4L6g3nShT-eMCtK--X86sw"
  listeners:
    clientName: CLIENT
    controllerName: CONTROLLER
    clientPort: 9092
    controllerPort: 9093
    advertisedHost: kafka
  security:
    protocolMap: "CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT"
    saslEnabledMechanisms: "PLAIN"
    saslMechanismInterBrokerProtocol: "PLAIN"
    brokerUsername: "broker"
    applicationUsername: "app"
  replication:
    offsetsTopicFactor: 1
    transactionStateLogFactor: 1
    transactionStateLogMinIsr: 1
  autoCreateTopics: "true"
  persistence:
    enabled: false
    size: 1Gi
    mountPath: /var/lib/kafka/data

mysql:
  replicaCount: 1
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  port: 3306
  persistence:
    size: 100Mi

redis:
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  port: 6379
  persistence:
    size: 100Mi

mysqldExporter:
  replicaCount: 1
  image:
    repository: prom/mysqld-exporter
    tag: "v0.19.0"
    pullPolicy: IfNotPresent
  port: 9104
  mysql:
    host: mysql
    username: root

nodeExporter:
  image:
    repository: prom/node-exporter
    tag: "v1.12.1"
    pullPolicy: IfNotPresent
  port: 9100
  hostPaths:
    proc: /proc
    sys: /sys
    root: /
  filesystemMountPointsExclude: "^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"

prometheus:
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: "v2.53.0"
  port: 9090

grafana:
  replicaCount: 1
  image:
    repository: grafana/grafana
    tag: "11.1.0"
  port: 3000

tempo:
  replicaCount: 1
  image:
    repository: grafana/tempo
    tag: "latest"
  httpPort: 3200
  otlpHttpPort: 4318

config:
  mysqlDatabase: "groovy"
  mysqlUsername: "root"
  redisHost: "redis"

  dbPool:
    maxSize: "30"
    minIdle: "10"

  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"

  grafanaAdminUser: "admin"

loki:
  replicaCount: 1
  image:
    repository: grafana/loki
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  port: 3100

alloy:
  replicaCount: 1
  image:
    repository: grafana/alloy
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 12345
