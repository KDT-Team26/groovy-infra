apiVersion: v1
kind: Secret
metadata:
  name: study-service-secret
  labels:
    app: study-service
type: Opaque
stringData:
  SPRING_DEV_DB_PASSWORD: {{ required "secret.studyService.dbPassword is required" .Values.secret.studyService.dbPassword | quote }}
  KAFKA_SASL_JAAS_CONFIG: {{ .Values.secret.studyService.kafkaSaslJaasConfig | default (printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";" .Values.kafka.security.applicationUsername (required "secret.kafka.applicationPassword is required" .Values.secret.kafka.applicationPassword)) | quote }}
