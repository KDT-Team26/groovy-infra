apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  labels:
    app: mysql
data:
  01-msa-init.sh: |
    #!/bin/bash
    set -e

    create_database_and_user() {
      local database_name="$1"
      local database_user="$2"
      local database_password="$3"
      local password_hex

      password_hex="$(printf '%s' "$database_password" | od -An -tx1 | tr -d ' \n')"

      mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<EOSQL
        CREATE DATABASE IF NOT EXISTS \`${database_name}\`
          CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

        SET @database_password = CONVERT(0x${password_hex} USING utf8mb4);
        SET @create_user = CONCAT(
          'CREATE USER IF NOT EXISTS ''${database_user}''@''%'' IDENTIFIED BY ',
          QUOTE(@database_password)
        );
        PREPARE create_user_statement FROM @create_user;
        EXECUTE create_user_statement;
        DEALLOCATE PREPARE create_user_statement;

        GRANT ALL PRIVILEGES ON \`${database_name}\`.* TO '${database_user}'@'%';
        FLUSH PRIVILEGES;
    EOSQL
    }

    create_database_and_user \
      {{ .Values.identityService.database.name | quote }} \
      {{ .Values.identityService.database.username | quote }} \
      "$IDENTITY_SERVICE_DB_PASSWORD"
    create_database_and_user \
      {{ .Values.studyService.database.name | quote }} \
      {{ .Values.studyService.database.username | quote }} \
      "$STUDY_SERVICE_DB_PASSWORD"
    create_database_and_user \
      {{ .Values.contentService.database.name | quote }} \
      {{ .Values.contentService.database.username | quote }} \
      "$CONTENT_SERVICE_DB_PASSWORD"
    create_database_and_user \
      {{ .Values.calendarService.database.name | quote }} \
      {{ .Values.calendarService.database.username | quote }} \
      "$CALENDAR_SERVICE_DB_PASSWORD"
    create_database_and_user \
      {{ .Values.notificationService.database.name | quote }} \
      {{ .Values.notificationService.database.username | quote }} \
      "$NOTIFICATION_SERVICE_DB_PASSWORD"
