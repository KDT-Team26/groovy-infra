notificationService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: ttt103/groovy-notification-service
    tag: "fbc55046941deb30b2c0be141172a27618d30dd7"
    pullPolicy: IfNotPresent
  port: 8085
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8085 }
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet: { path: /actuator/health, port: 8085 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /actuator/health, port: 8085 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=224m -Xss256k"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: notification-mysql
    port: 3306
    name: notification_db
    username: notification_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"
    topic: "notification-events"

# 다른 서비스 차트와 달리 corsAllowedOrigins는 쓰지 않는다(이 서비스는 프론트가 직접 호출하지
# 않고 게이트웨이를 경유하는 REST + SSE 뿐이라 CORS_ALLOWED_ORIGINS 환경변수 자체가 없다).
config:
  timezone: "Asia/Seoul"
