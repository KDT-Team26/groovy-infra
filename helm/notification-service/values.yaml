notificationService:
  replicaCount: 1
  image:
    repository: ttt103/groovy-notification-service
    tag: "de8b7258afbeb505cd820ca0732cd33eb4d40c0e"
  port: 8085
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"
  hpa:
    enabled: false # TEMP: JVM 메모리 옵션 전/후 비교 테스트 위해 replica=1 고정 (테스트 끝나면 true로 복구)
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: groovy-rds-mysql.cjmu2is60j25.ap-northeast-2.rds.amazonaws.com
    port: 3306
    name: notification_db
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"
    topic: "notification-events"

# 다른 서비스 차트와 달리 corsAllowedOrigins는 쓰지 않는다(이 서비스는 프론트가 직접 호출하지
# 않고 게이트웨이를 경유하는 REST + SSE 뿐이라 CORS_ALLOWED_ORIGINS 환경변수 자체가 없다).
config:
  timezone: "Asia/Seoul"
