notificationService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: 665206375378.dkr.ecr.ap-northeast-2.amazonaws.com/groovy-notification-service
    tag: "5e9a51d47eaea52c496cd0f1f4d73ddd8d0ee958"
    pullPolicy: IfNotPresent
  port: 8085
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
    # 자동 롤백(auto-rollback P1): 새 Pod가 Ready되지 못하는 배포를 기본 600s 대신 180s 만에
    # ProgressDeadlineExceeded로 판정 → ArgoCD Degraded 전환·감지가 3분 내로 빨라진다.
    progressDeadlineSeconds: 180
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8085 }
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      # 자동 롤백(auto-rollback P1): readiness 그룹만 확인한다. DB/Kafka/Redis 등 외부 의존성은
      # 제외 — 의존성 블립이 롤아웃을 막거나 오탐 롤백을 유발하지 않게 한다.
      httpGet: { path: /actuator/health/readiness, port: 8085 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      # liveness 그룹만 확인(프로세스 생존). 의존성 DOWN으로 컨테이너가 재시작되지 않게 한다.
      httpGet: { path: /actuator/health/liveness, port: 8085 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=224m -Xss256k"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: groovy-rds-mysql.cjmu2is60j25.ap-northeast-2.rds.amazonaws.com
    port: 3306
    name: notification_db
    username: notification_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  redis:
    host: redis
    port: 6379
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"
    topic: "notification-events"

# 다른 서비스 차트와 달리 corsAllowedOrigins는 쓰지 않는다(이 서비스는 프론트가 직접 호출하지
# 않고 게이트웨이를 경유하는 REST + SSE 뿐이라 CORS_ALLOWED_ORIGINS 환경변수 자체가 없다).
config:
  timezone: "Asia/Seoul"
