apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  {{- if not .Values.notificationService.hpa.enabled }}
  replicas: {{ .Values.notificationService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: notification-service-sa
      volumes:
        - name: rds-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: notification-rds-secrets
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          volumeMounts:
            - name: rds-secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-rds-secret
          env:
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: app-jaas-config
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.notificationService.javaOpts | quote }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
              protocol: TCP
          {{- if .Values.notificationService.resources }}
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          {{- end }}
