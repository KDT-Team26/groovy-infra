apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  # 롤아웃 안전장치(#90) — 상세 설명은 identity-service-deployment.yaml 참고.
  revisionHistoryLimit: {{ .Values.notificationService.rollout.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.notificationService.rollout.maxUnavailable }}
      maxSurge: {{ .Values.notificationService.rollout.maxSurge }}
  {{- if not .Values.notificationService.hpa.enabled }}
  replicas: {{ .Values.notificationService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secret
          env:
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: app-jaas-config
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.notificationService.javaOpts | quote }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
              protocol: TCP
          # health probe(#90) — 상세 설명은 identity-service-deployment.yaml 참고.
          {{- if .Values.notificationService.probes.enabled }}
          startupProbe:
            {{- toYaml .Values.notificationService.probes.startup | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.notificationService.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.notificationService.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.notificationService.resources }}
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          {{- end }}
