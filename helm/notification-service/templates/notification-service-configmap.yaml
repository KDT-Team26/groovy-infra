apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  labels:
    app: notification-service
data:
  SPRING_DEV_DB_URL: {{ printf "jdbc:mysql://%s:%v/%s?%s" .Values.notificationService.database.host .Values.notificationService.database.port .Values.notificationService.database.name .Values.notificationService.database.parameters | quote }}
  SPRING_DEV_DB_USERNAME: {{ .Values.notificationService.database.username | quote }}
  DB_POOL_MAX_SIZE: {{ .Values.notificationService.dbPool.maxSize | quote }}
  DB_POOL_MIN_IDLE: {{ .Values.notificationService.dbPool.minIdle | quote }}
  JWT_JWKS_URL: {{ .Values.notificationService.jwt.jwksUrl | quote }}
  JWT_JWKS_CONNECT_TIMEOUT_MS: {{ .Values.notificationService.jwt.connectTimeoutMs | quote }}
  JWT_JWKS_READ_TIMEOUT_MS: {{ .Values.notificationService.jwt.readTimeoutMs | quote }}
  JWT_JWKS_CACHE_TTL_SECONDS: {{ .Values.notificationService.jwt.cacheTtlSeconds | quote }}
  REDIS_HOST: {{ .Values.notificationService.redis.host | quote }}
  REDIS_PORT: {{ .Values.notificationService.redis.port | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.notificationService.kafka.bootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.notificationService.kafka.securityProtocol | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.notificationService.kafka.saslMechanism | quote }}
  NOTIFICATION_KAFKA_TOPIC: {{ .Values.notificationService.kafka.topic | quote }}
  TZ: {{ .Values.config.timezone | quote }}
  OTLP_TRACING_ENDPOINT: "http://tempo.groovy-monitoring.svc.cluster.local:4318/v1/traces"
