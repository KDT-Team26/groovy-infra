calendarService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: ttt103/groovy-calendar-service
    tag: "c619b87ce97ede1757130139c5bf447b2eff08c5"
    pullPolicy: IfNotPresent
  port: 8084
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8084 }
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet: { path: /actuator/health, port: 8084 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /actuator/health, port: 8084 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"
  hpa:
    enabled: true
  database:
    host: calendar-mysql
    port: 3306
    name: calendar_db
    username: calendar_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  studyService:
    url: "http://study-service:8082"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"

sealedSecretData:
  calendarService:
    dbPassword: 
