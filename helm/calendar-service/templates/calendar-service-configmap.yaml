apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-service-config
  labels:
    app: calendar-service
data:
  SPRING_DEV_DB_URL: {{ printf "jdbc:mysql://%s:%v/%s?%s" .Values.calendarService.database.host .Values.calendarService.database.port .Values.calendarService.database.name .Values.calendarService.database.parameters | quote }}
  SPRING_DEV_DB_USERNAME: {{ .Values.calendarService.database.username | quote }}
  DB_POOL_MAX_SIZE: {{ .Values.calendarService.dbPool.maxSize | quote }}
  DB_POOL_MIN_IDLE: {{ .Values.calendarService.dbPool.minIdle | quote }}
  JWT_JWKS_URL: {{ .Values.calendarService.jwt.jwksUrl | quote }}
  JWT_JWKS_CONNECT_TIMEOUT_MS: {{ .Values.calendarService.jwt.connectTimeoutMs | quote }}
  JWT_JWKS_READ_TIMEOUT_MS: {{ .Values.calendarService.jwt.readTimeoutMs | quote }}
  JWT_JWKS_CACHE_TTL_SECONDS: {{ .Values.calendarService.jwt.cacheTtlSeconds | quote }}
  STUDY_SERVICE_URL: {{ .Values.calendarService.studyService.url | quote }}
  STUDY_SERVICE_CONNECT_TIMEOUT_MS: {{ .Values.calendarService.studyService.connectTimeoutMs | quote }}
  STUDY_SERVICE_READ_TIMEOUT_MS: {{ .Values.calendarService.studyService.readTimeoutMs | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.calendarService.kafka.bootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.calendarService.kafka.securityProtocol | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.calendarService.kafka.saslMechanism | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  TZ: {{ .Values.config.timezone | quote }}
  OTLP_TRACING_ENDPOINT: "http://tempo.groovy-monitoring.svc.cluster.local:4318/v1/traces"
