{{- if .Values.studyService.pdb.enabled }}
# PodDisruptionBudget(#91) — 상세 설명은 identity-service-pdb.yaml 참고. replica>=2 에서만 켠다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: study-service
  labels:
    app: study-service
spec:
  minAvailable: {{ .Values.studyService.pdb.minAvailable }}
  selector:
    matchLabels:
      app: study-service
{{- end }}
