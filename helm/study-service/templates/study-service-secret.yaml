# ESO(External Secrets Operator)로 전환(1단계) — identity-service의 동일 파일 주석 참고.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: study-service-secret
  labels:
    app: study-service
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: study-service-secret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DEV_DB_PASSWORD
      remoteRef:
        key: groovy/rds/study
        property: password
