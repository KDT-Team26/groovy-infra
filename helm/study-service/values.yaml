studyService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: 665206375378.dkr.ecr.ap-northeast-2.amazonaws.com/groovy-study-service
    tag: "ae6677f25a88a65b63e69b16805452f2d7e28bcc"
    pullPolicy: IfNotPresent
  port: 8082
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
    # 자동 롤백(auto-rollback P1c): 감지 단축. 값 근거는
    # docs/auto-rollback-coldstart-measurements.md (실측 콜드스타트 17~85s).
    progressDeadlineSeconds: 240
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8082 }
      periodSeconds: 10
      failureThreshold: 18
    readiness:
      # 자동 롤백(auto-rollback P1c): readiness 그룹만 — 외부 의존성 블립이 롤아웃/오탐 롤백을
      # 유발하지 않게.
      httpGet: { path: /actuator/health/readiness, port: 8082 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      # liveness 그룹만(프로세스 생존).
      httpGet: { path: /actuator/health/liveness, port: 8082 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -Xss256k"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  database:
    host: groovy-rds-mysql.cjmu2is60j25.ap-northeast-2.rds.amazonaws.com
    port: 3306
    name: study_db
    username: study_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "13"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  identityService:
    url: "http://identity-service:8081"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"
