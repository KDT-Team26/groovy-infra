frontend:
  replicaCount: 1
  image:
    repository: ttt103/groovy-frontend
    tag: "983e3eff0a55a17661a3730cec04370c20a3a706"
    pullPolicy: Always
  port: 5173
  # 브라우저가 직접 호출하는 외부 접근 가능 주소라 내부 k8s Service DNS로 유도할 수 없다.
  # Ingress 구축 전까지는 로컬 플레이스홀더로 둔다.
  apiBaseUrl: "http://beancp.com:8090"
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  # 정적 서버라 기동이 빨라 startup 여유를 백엔드보다 짧게 잡는다(최대 60s).
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
  probes:
    enabled: true
    startup:
      httpGet: { path: /, port: 5173 }
      periodSeconds: 5
      failureThreshold: 12
    readiness:
      httpGet: { path: /, port: 5173 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /, port: 5173 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  # frontend 는 hpa.enabled=true 라 replicaCount 대신 hpa.minReplicas 로 HA 확보(values-ha.yaml).
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
