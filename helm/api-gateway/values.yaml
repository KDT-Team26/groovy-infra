apiGateway:
  replicaCount: 1
  image:
    # Docker Hub 리포지토리명은 groovy-gateway-service(서비스 레포명과 동일)로 생성됐다 —
    # 차트/values 키 이름은 api-gateway/apiGateway를 그대로 쓰지만 이미지 리포지토리명만 다르다.
    repository: ttt103/groovy-gateway-service
    tag: "71075cba4d75b47e0e1b58de8931aa2de64676d8"
  port: 8080
  managementPort: 8090 # actuator port로 새로 하나 만들었습니다. - 변
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

# api-gateway-configmap.yaml이 각 서비스의 ClusterIP DNS 이름(서비스명은 각 서비스 차트가
# Service 리소스명으로 고정하므로 안 바뀐다)과 포트를 조합해 라우팅 대상 URL을 만든다.
# 차트가 분리되어 다른 차트의 values.yaml을 직접 참조할 수 없으므로, 포트 번호만 이 차트에도
# 복제해 둔다 — 실제 서비스 인스턴스 값이 아니라 각 서비스가 고정으로 리스닝하는 포트이므로
# 차트가 분리돼도 값이 갈라질 위험은 없다.
identityService:
  port: 8081
studyService:
  port: 8082
contentService:
  port: 8083
calendarService:
  port: 8084
notificationService:
  port: 8085

# api-gateway-configmap.yaml의 APP_CORS_ALLOWED_ORIGINS가 참조한다(PR #23에서 추가됐는데
# 이 config 섹션이 누락돼 helm template이 nil pointer로 깨지고 있었음). identity-service
# 차트의 config.corsAllowedOrigins와 동일한 값으로 맞춘다 — 둘 다 프론트엔드 오리진을 검증하는
# CORS 설정이라 값이 갈라지면 한쪽만 프론트 요청을 막는 상황이 생긴다.
config:
  corsAllowedOrigins: "http://localhost:5173"
