apiGateway:
  replicaCount: 1
  image:
    # Docker Hub 리포지토리명은 groovy-gateway-service(서비스 레포명과 동일)로 생성됐다 —
    # 차트/values 키 이름은 api-gateway/apiGateway를 그대로 쓰지만 이미지 리포지토리명만 다르다.
    repository: ttt103/groovy-gateway-service
    tag: "msa-v1"
  port: 8080
  managementPort: 8090 # actuator port로 새로 하나 만들었습니다. - 변

# api-gateway-configmap.yaml이 각 서비스의 ClusterIP DNS 이름(서비스명은 각 서비스 차트가
# Service 리소스명으로 고정하므로 안 바뀐다)과 포트를 조합해 라우팅 대상 URL을 만든다.
# 차트가 분리되어 다른 차트의 values.yaml을 직접 참조할 수 없으므로, 포트 번호만 이 차트에도
# 복제해 둔다 — 실제 서비스 인스턴스 값이 아니라 각 서비스가 고정으로 리스닝하는 포트이므로
# 차트가 분리돼도 값이 갈라질 위험은 없다.
identityService:
  port: 8081
studyService:
  port: 8082
contentService:
  port: 8083
calendarService:
  port: 8084
notificationService:
  port: 8085
