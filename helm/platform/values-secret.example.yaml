secret:
  mysqlRootPassword: "CHANGE_ME"
  mysql:
    provisionerPassword: "CHANGE_ME"
  kafka:
    brokerPassword: "CHANGE_ME"
    applicationPassword: "CHANGE_ME"
  # 아래 5개는 db-init Job이 각 서비스 DB 계정을 생성할 때 쓰는 값이다. 반드시 해당 서비스
  # 차트(helm/<service>/values-secret.yaml)의 secret.<service>.dbPassword와 동일해야 앱이
  # 실제로 접속할 수 있다 — 차트가 분리된 대가로 이 값은 두 곳에 중복 보관된다.
  identityService:
    dbPassword: "CHANGE_ME"
  studyService:
    dbPassword: "CHANGE_ME"
  contentService:
    dbPassword: "CHANGE_ME"
  calendarService:
    dbPassword: "CHANGE_ME"
  notificationService:
    dbPassword: "CHANGE_ME"
