apiVersion: batch/v1
kind: Job
metadata:
  name: identity-service-db-init
  labels:
    app: identity-service-db-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: identity-service-db-init
    spec:
      restartPolicy: Never
      initContainers:
        # MySQL 리소스는 Sync wave 0, DB-init Job은 Sync wave 1에서 실행된다.
        # MySQL 프로세스와 provisioner 계정이 실제로 준비될 때까지
        # 직접 재시도한다(최대 3분, 3초 간격 60회).
        - name: wait-for-mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              i=0
              until mysqladmin ping -h identity-mysql -u provisioner -p"$MYSQL_PWD" --silent; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "provisioner 계정에 60회 시도 후에도 접속 실패" >&2
                  exit 1
                fi
                sleep 3
              done
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: identity-mysql-secret
                  key: MYSQL_PROVISIONER_PASSWORD
      containers:
        - name: db-init
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}
          command:
            - sh
            - -c
            - mysql -h identity-mysql -u provisioner < /sql/init.sql
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: identity-mysql-secret
                  key: MYSQL_PROVISIONER_PASSWORD
          volumeMounts:
            - name: init-sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: init-sql
          secret:
            secretName: db-init-sql
            items:
              - key: identity-service.sql
                path: init.sql