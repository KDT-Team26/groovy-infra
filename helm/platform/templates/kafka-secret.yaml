apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  labels:
    app: kafka
type: Opaque
stringData:
  broker-jaas-config: {{ printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\" user_%s=\"%s\" user_%s=\"%s\";" .Values.kafka.security.brokerUsername (required "secret.kafka.brokerPassword is required" .Values.secret.kafka.brokerPassword) .Values.kafka.security.brokerUsername .Values.secret.kafka.brokerPassword .Values.kafka.security.applicationUsername (required "secret.kafka.applicationPassword is required" .Values.secret.kafka.applicationPassword) | quote }}
  # study/content/calendar/notification 4개 서비스가 공유하는 app 계정 JAAS 설정. platform이 한 번만
  # 계산해서 여기 보관하고, 서비스들은 secretKeyRef로 이 값을 직접 참조한다(값 복제 방지).
  app-jaas-config: {{ printf "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"%s\" password=\"%s\";" .Values.kafka.security.applicationUsername (required "secret.kafka.applicationPassword is required" .Values.secret.kafka.applicationPassword) | quote }}
  adminclient.conf: |
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism={{ .Values.kafka.security.saslEnabledMechanisms }}
    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.kafka.security.brokerUsername }}" password="{{ required "secret.kafka.brokerPassword is required" .Values.secret.kafka.brokerPassword }}";
