# Sealed Secrets로 전환(2026-08-26) — 이유는 identity-service의 동일 파일 주석 참고.
#
# 3개 키 전부 "사용자명(비밀 아님, values.yaml의 kafka.security.brokerUsername/
# applicationUsername) + 비밀번호"를 조합한 문자열이라, 완성된 값 전체를 암호화해야 한다.
# 아래 형식(printf 포맷 그대로)에 실제 사용자명·비밀번호를 채운 뒤 통째로 암호화한다:
#
#   broker-jaas-config:
#     org.apache.kafka.common.security.plain.PlainLoginModule required
#     username="<brokerUsername>" password="<broker 비밀번호>"
#     user_<brokerUsername>="<broker 비밀번호>" user_<applicationUsername>="<application 비밀번호>";
#
#   app-jaas-config:
#     org.apache.kafka.common.security.plain.PlainLoginModule required
#     username="<applicationUsername>" password="<application 비밀번호>";
#
#   adminclient.conf: |
#     security.protocol=SASL_PLAINTEXT
#     sasl.mechanism=<kafka.security.saslEnabledMechanisms 값>
#     sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required
#       username="<brokerUsername>" password="<broker 비밀번호>";
#
# argocd/bootstrap/seal-secret-values.sh가 values.yaml의 사용자명 값을 그대로 읽어서 조립까지
# 자동으로 해준다 — 비밀번호 2개만 입력하면 된다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: kafka-secret
  labels:
    app: kafka
spec:
  encryptedData:
    broker-jaas-config: {{ required "sealedSecretData.kafka.brokerJaasConfig is required" .Values.sealedSecretData.kafka.brokerJaasConfig | quote }}
    # study/content/calendar/notification 4개 서비스가 공유하는 app 계정 JAAS 설정. platform이
    # 한 번만 계산해서 여기 보관하고, 서비스들은 secretKeyRef로 이 값을 직접 참조한다(값 복제 방지).
    app-jaas-config: {{ required "sealedSecretData.kafka.appJaasConfig is required" .Values.sealedSecretData.kafka.appJaasConfig | quote }}
    adminclient.conf: {{ required "sealedSecretData.kafka.adminclientConf is required" .Values.sealedSecretData.kafka.adminclientConf | quote }}
  template:
    metadata:
      name: kafka-secret
      labels:
        app: kafka
    type: Opaque
