# ESO(External Secrets Operator)로 전환(1단계) — groovy/prod/kafka에 3개 키(broker-jaas-config/
# app-jaas-config/adminclient.conf)가 이미 조립된 형태로 저장돼 있어 그대로 매핑한다.
# app-jaas-config는 study/content/calendar/notification 4개 서비스가 secretKeyRef로 공유 참조.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-secret
  labels:
    app: kafka
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: kafka-secret
    creationPolicy: Owner
  data:
    - secretKey: broker-jaas-config
      remoteRef:
        key: groovy/prod/kafka
        property: broker-jaas-config
    - secretKey: app-jaas-config
      remoteRef:
        key: groovy/prod/kafka
        property: app-jaas-config
    - secretKey: adminclient.conf
      remoteRef:
        key: groovy/prod/kafka
        property: adminclient.conf
