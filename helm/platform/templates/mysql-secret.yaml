apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    app: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.secret.mysqlRootPassword | quote }}
  MYSQL_PROVISIONER_PASSWORD: {{ required "secret.mysql.provisionerPassword is required" .Values.secret.mysql.provisionerPassword | quote }}
  # provisioner는 서비스별 DB/계정 생성 전용 계정이다. 생성할 DB 이름을 미리 알 수 없어 GRANT
  # 대상을 스키마 단위로 좁힐 수 없으므로 *.*에 WITH GRANT OPTION을 준다 — 사실상 root와 동급
  # 권한이지만, DB init Job이 root 비밀번호 자체를 몰라도 되게 하는 것이 이 계정 분리의 목적이다.
  00-provisioner-init.sql: |
    CREATE USER IF NOT EXISTS 'provisioner'@'%'
      IDENTIFIED BY {{ required "secret.mysql.provisionerPassword is required" .Values.secret.mysql.provisionerPassword | quote }};

    GRANT ALL PRIVILEGES ON *.* TO 'provisioner'@'%' WITH GRANT OPTION;

    FLUSH PRIVILEGES;
