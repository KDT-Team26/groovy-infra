# ESO(External Secrets Operator)로 전환(1단계) — 레거시 in-cluster MySQL(RDS 이관 후 롤백
# 경로로만 보존, groovy-infra#89 참고)의 인스턴스별 root/provisioner 비밀번호.
# groovy/legacy/mysql-<instance>에 rootPassword/provisionerPassword 2개 값만 저장해두고,
# provisioner 계정 생성 SQL(00-provisioner-init.sql)은 ESO의 target.template으로 그 자리에서
# 조립한다 — Sealed Secrets 시절처럼 완성된 SQL 문자열 자체를 저장소에 박아둘 필요가 없다.
{{- range $name, $instance := .Values.mysql.instances }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mysql-secret
  labels:
    app: {{ $name }}-mysql
    groovy.io/service: {{ $name }}
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: {{ $name }}-mysql-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MYSQL_ROOT_PASSWORD: "{{ "{{" }} .rootPassword {{ "}}" }}"
        MYSQL_PROVISIONER_PASSWORD: "{{ "{{" }} .provisionerPassword {{ "}}" }}"
        00-provisioner-init.sql: |
          CREATE USER IF NOT EXISTS 'provisioner'@'%'
            IDENTIFIED BY '{{ "{{" }} .provisionerPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON *.* TO 'provisioner'@'%' WITH GRANT OPTION;

          FLUSH PRIVILEGES;
  data:
    - secretKey: rootPassword
      remoteRef:
        key: groovy/legacy/mysql-{{ $name }}
        property: rootPassword
    - secretKey: provisionerPassword
      remoteRef:
        key: groovy/legacy/mysql-{{ $name }}
        property: provisionerPassword
{{- end }}
