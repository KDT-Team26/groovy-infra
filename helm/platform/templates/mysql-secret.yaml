# Sealed Secrets로 전환(2026-08-26) — 이유는 identity-service의 동일 파일 주석 참고.
#
# 00-provisioner-init.sql은 비밀번호만 빼면 나머지가 고정 SQL이라, 예전처럼 Helm이 문자열을
# 조립해주지 못한다(암호화는 완성된 값 전체에 대해서만 되므로, 부분 조립을 나중에 템플릿에서
# 못 한다). 그래서 아래 SQL을 실제 provisioner 비밀번호로 채운 완성본을 통째로 암호화해야 한다:
#
#   CREATE USER IF NOT EXISTS 'provisioner'@'%'
#     IDENTIFIED BY '<실제 provisioner 비밀번호>';
#
#   GRANT ALL PRIVILEGES ON *.* TO 'provisioner'@'%' WITH GRANT OPTION;
#
#   FLUSH PRIVILEGES;
#
# argocd/bootstrap/seal-secret-values.sh가 이 조립까지 자동으로 해준다. 세 값 모두 채운 뒤
# helm/platform/values.yaml의 sealedSecretData.mysql.* 에 붙여넣는다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mysql-secret
  labels:
    app: mysql
spec:
  encryptedData:
    MYSQL_ROOT_PASSWORD: {{ required "sealedSecretData.mysql.rootPassword is required" .Values.sealedSecretData.mysql.rootPassword | quote }}
    MYSQL_PROVISIONER_PASSWORD: {{ required "sealedSecretData.mysql.provisionerPassword is required" .Values.sealedSecretData.mysql.provisionerPassword | quote }}
    # provisioner는 서비스별 DB/계정 생성 전용 계정이다. 생성할 DB 이름을 미리 알 수 없어 GRANT
    # 대상을 스키마 단위로 좁힐 수 없으므로 *.*에 WITH GRANT OPTION을 준다 — 사실상 root와 동급
    # 권한이지만, DB init Job이 root 비밀번호 자체를 몰라도 되게 하는 것이 이 계정 분리의 목적이다.
    00-provisioner-init.sql: {{ required "sealedSecretData.mysql.provisionerInitSql is required" .Values.sealedSecretData.mysql.provisionerInitSql | quote }}
  template:
    metadata:
      name: mysql-secret
      labels:
        app: mysql
    type: Opaque
