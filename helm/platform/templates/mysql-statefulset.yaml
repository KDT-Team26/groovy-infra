{{- range $name, $instance := .Values.mysql.instances }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-mysql
  labels:
    app: {{ $name }}-mysql
    groovy.io/service: {{ $name }}
spec:
  serviceName: {{ $name }}-mysql
  replicas: {{ $instance.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}-mysql
  template:
    metadata:
      labels:
        app: {{ $name }}-mysql
        groovy.io/service: {{ $name }}
    spec:
      containers:
        - name: groovy-mysql
          image: "{{ $.Values.mysql.image.repository }}:{{ $.Values.mysql.image.tag }}"
          imagePullPolicy: {{ $.Values.mysql.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: mysql-config
            - secretRef:
                name: {{ $name }}-mysql-secret
          ports:
            - containerPort: {{ $.Values.mysql.port }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD"'
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            # mysql 공식 이미지는 데이터 디렉토리가 비어있는 최초 기동 시에만
            # /docker-entrypoint-initdb.d/*.sql을 root 권한으로 자동 실행한다.
            # 각 MySQL 인스턴스의 provisioner 계정을 서비스별 Secret으로 생성한다.
            - name: mysql-provisioner-init
              mountPath: /docker-entrypoint-initdb.d/00-provisioner-init.sql
              subPath: 00-provisioner-init.sql
              readOnly: true
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ $name }}-mysql-data
        - name: mysql-provisioner-init
          secret:
            secretName: {{ $name }}-mysql-secret
            items:
              - key: 00-provisioner-init.sql
                path: 00-provisioner-init.sql
{{- end }}