# Sealed Secrets로 전환(2026-08-26) — 이유는 identity-service의 동일 파일 주석 참고.
#
# 5개 키 전부 "비밀번호만 빼면 고정 SQL"이라 mysql-secret.yaml과 같은 이유로 완성된 SQL
# 전체를 암호화해야 한다. 서비스별로 아래 형태(<service>는 identity/study/content/calendar/
# notification, <db>는 각각 identity_db/study_db/content_db/calendar_db/notification_db)를
# 실제 비밀번호로 채운 뒤 통째로 암호화한다 — 이 값은 반드시 해당 서비스 차트
# (helm/<service>/values.yaml의 sealedSecretData.<service>.dbPassword)와 같은 원본 비밀번호로
# 만들어야 한다(같은 값을 서로 다른 두 SealedSecret으로 각각 암호화 — 값 자체는 같아도 암호문은
# 매번 달라지는 게 정상, 걱정할 필요 없음).
#
#   CREATE DATABASE IF NOT EXISTS <db>
#     CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
#
#   CREATE USER IF NOT EXISTS '<service>_service'@'%'
#     IDENTIFIED BY '<실제 비밀번호>';
#
#   GRANT ALL PRIVILEGES ON <db>.* TO '<service>_service'@'%';
#
#   FLUSH PRIVILEGES;
#
# argocd/bootstrap/seal-secret-values.sh가 5개 전부 자동으로 조립해준다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-init-sql
  labels:
    app: mysql
spec:
  encryptedData:
    identity-service.sql: {{ required "sealedSecretData.dbInit.identityService is required" .Values.sealedSecretData.dbInit.identityService | quote }}
    study-service.sql: {{ required "sealedSecretData.dbInit.studyService is required" .Values.sealedSecretData.dbInit.studyService | quote }}
    content-service.sql: {{ required "sealedSecretData.dbInit.contentService is required" .Values.sealedSecretData.dbInit.contentService | quote }}
    calendar-service.sql: {{ required "sealedSecretData.dbInit.calendarService is required" .Values.sealedSecretData.dbInit.calendarService | quote }}
    notification-service.sql: {{ required "sealedSecretData.dbInit.notificationService is required" .Values.sealedSecretData.dbInit.notificationService | quote }}
  template:
    metadata:
      name: db-init-sql
      labels:
        app: mysql
    type: Opaque
