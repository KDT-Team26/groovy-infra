# ESO(External Secrets Operator)로 전환(1단계) — 레거시 in-cluster MySQL(RDS 이관 후 롤백
# 경로로만 보존) 부트스트랩용 DB/유저 생성 SQL. 롤백 시나리오에서 다른 값을 새로 안 챙겨도
# 되도록, 각 서비스 유저 비밀번호는 해당 서비스의 현재 RDS 비밀번호(groovy/rds/<service>)를
# 그대로 재사용한다(원래 Sealed Secrets 시절부터의 규칙: 이 값은 서비스 차트가 실제로 쓰는
# DB 비밀번호와 같아야 한다). SQL 본문은 ESO의 target.template으로 그 자리에서 조립한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-init-sql
  labels:
    app: mysql
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: db-init-sql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        identity-service.sql: |
          CREATE DATABASE IF NOT EXISTS identity_db
            CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

          CREATE USER IF NOT EXISTS 'identity_service'@'%'
            IDENTIFIED BY '{{ "{{" }} .identityPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON identity_db.* TO 'identity_service'@'%';

          FLUSH PRIVILEGES;
        study-service.sql: |
          CREATE DATABASE IF NOT EXISTS study_db
            CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

          CREATE USER IF NOT EXISTS 'study_service'@'%'
            IDENTIFIED BY '{{ "{{" }} .studyPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON study_db.* TO 'study_service'@'%';

          FLUSH PRIVILEGES;
        content-service.sql: |
          CREATE DATABASE IF NOT EXISTS content_db
            CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

          CREATE USER IF NOT EXISTS 'content_service'@'%'
            IDENTIFIED BY '{{ "{{" }} .contentPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON content_db.* TO 'content_service'@'%';

          FLUSH PRIVILEGES;
        calendar-service.sql: |
          CREATE DATABASE IF NOT EXISTS calendar_db
            CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

          CREATE USER IF NOT EXISTS 'calendar_service'@'%'
            IDENTIFIED BY '{{ "{{" }} .calendarPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON calendar_db.* TO 'calendar_service'@'%';

          FLUSH PRIVILEGES;
        notification-service.sql: |
          CREATE DATABASE IF NOT EXISTS notification_db
            CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

          CREATE USER IF NOT EXISTS 'notification_service'@'%'
            IDENTIFIED BY '{{ "{{" }} .notificationPassword {{ "}}" }}';

          GRANT ALL PRIVILEGES ON notification_db.* TO 'notification_service'@'%';

          FLUSH PRIVILEGES;
  data:
    - secretKey: identityPassword
      remoteRef:
        key: groovy/rds/identity
        property: password
    - secretKey: studyPassword
      remoteRef:
        key: groovy/rds/study
        property: password
    - secretKey: contentPassword
      remoteRef:
        key: groovy/rds/content
        property: password
    - secretKey: calendarPassword
      remoteRef:
        key: groovy/rds/calendar
        property: password
    - secretKey: notificationPassword
      remoteRef:
        key: groovy/rds/notification
        property: password
