apiVersion: v1
kind: Secret
metadata:
  name: db-init-sql
  labels:
    app: mysql
type: Opaque
stringData:
  # 각 서비스 레포의 services/<service>/src/main/resources/db/init/init-db-and-user.sql을
  # 그대로 옮겨온 사본이다(원본 소유권은 각 서비스 레포에 있다). 다만 원본에 고정으로 박혀있는
  # "local_only" 비밀번호 대신, 그 서비스 차트가 실제로 접속에 쓰는 secret.<service>.dbPassword와
  # 반드시 같은 값을 여기 넣어야 한다 — 두 차트가 독립적으로 배포되는 대가로 값이 중복 보관되며,
  # 배포자가 두 곳(이 파일과 해당 서비스 차트의 values-secret.yaml)을 함께 갱신해야 한다.
  identity-service.sql: |
    CREATE DATABASE IF NOT EXISTS identity_db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

    CREATE USER IF NOT EXISTS 'identity_service'@'%'
      IDENTIFIED BY {{ required "secret.identityService.dbPassword is required" .Values.secret.identityService.dbPassword | quote }};

    GRANT ALL PRIVILEGES ON identity_db.* TO 'identity_service'@'%';

    FLUSH PRIVILEGES;
  study-service.sql: |
    CREATE DATABASE IF NOT EXISTS study_db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

    CREATE USER IF NOT EXISTS 'study_service'@'%'
      IDENTIFIED BY {{ required "secret.studyService.dbPassword is required" .Values.secret.studyService.dbPassword | quote }};

    GRANT ALL PRIVILEGES ON study_db.* TO 'study_service'@'%';

    FLUSH PRIVILEGES;
  content-service.sql: |
    CREATE DATABASE IF NOT EXISTS content_db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

    CREATE USER IF NOT EXISTS 'content_service'@'%'
      IDENTIFIED BY {{ required "secret.contentService.dbPassword is required" .Values.secret.contentService.dbPassword | quote }};

    GRANT ALL PRIVILEGES ON content_db.* TO 'content_service'@'%';

    FLUSH PRIVILEGES;
  calendar-service.sql: |
    CREATE DATABASE IF NOT EXISTS calendar_db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

    CREATE USER IF NOT EXISTS 'calendar_service'@'%'
      IDENTIFIED BY {{ required "secret.calendarService.dbPassword is required" .Values.secret.calendarService.dbPassword | quote }};

    GRANT ALL PRIVILEGES ON calendar_db.* TO 'calendar_service'@'%';

    FLUSH PRIVILEGES;
  notification-service.sql: |
    CREATE DATABASE IF NOT EXISTS notification_db
      CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;

    CREATE USER IF NOT EXISTS 'notification_service'@'%'
      IDENTIFIED BY {{ required "secret.notificationService.dbPassword is required" .Values.secret.notificationService.dbPassword | quote }};

    GRANT ALL PRIVILEGES ON notification_db.* TO 'notification_service'@'%';

    FLUSH PRIVILEGES;
