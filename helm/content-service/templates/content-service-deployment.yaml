apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  labels:
    app: content-service
spec:
  # 롤아웃 안전장치(#90) — 상세 설명은 identity-service-deployment.yaml 참고.
  revisionHistoryLimit: {{ .Values.contentService.rollout.revisionHistoryLimit }}
  # 자동 롤백(auto-rollback P1): 새 ReplicaSet이 이 시간 내 Available되지 않으면 배포 실패로 간주
  # → ArgoCD Degraded. 기본 600s를 줄여 감지를 앞당긴다.
  progressDeadlineSeconds: {{ .Values.contentService.rollout.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.contentService.rollout.maxUnavailable }}
      maxSurge: {{ .Values.contentService.rollout.maxSurge }}
  {{- if not .Values.contentService.hpa.enabled }}
  replicas: {{ .Values.contentService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: "{{ .Values.contentService.image.repository }}:{{ .Values.contentService.image.tag }}"
          imagePullPolicy: {{ .Values.contentService.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: content-service-config
            - secretRef:
                name: content-service-secret
          env:
            - name: KAFKA_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: app-jaas-config
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.contentService.javaOpts | quote }}
          ports:
            - containerPort: {{ .Values.contentService.port }}
              protocol: TCP
          # health probe(#90) — 상세 설명은 identity-service-deployment.yaml 참고.
          {{- if .Values.contentService.probes.enabled }}
          startupProbe:
            {{- toYaml .Values.contentService.probes.startup | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.contentService.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.contentService.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.contentService.resources }}
          resources:
            {{- toYaml .Values.contentService.resources | nindent 12 }}
          {{- end }}
      # HA 프로파일(#91) — 비어 있으면 렌더 안 됨. 활성화 방법은 values-ha.yaml 참고.
      {{- with .Values.contentService.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
