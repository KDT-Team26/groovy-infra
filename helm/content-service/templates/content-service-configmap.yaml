apiVersion: v1
kind: ConfigMap
metadata:
  name: content-service-config
  labels:
    app: content-service
data:
  SPRING_DEV_DB_URL: {{ printf "jdbc:mysql://%s:%v/%s?%s" .Values.contentService.database.host .Values.contentService.database.port .Values.contentService.database.name .Values.contentService.database.parameters | quote }}
  DB_POOL_MAX_SIZE: {{ .Values.contentService.dbPool.maxSize | quote }}
  DB_POOL_MIN_IDLE: {{ .Values.contentService.dbPool.minIdle | quote }}
  JWT_JWKS_URL: {{ .Values.contentService.jwt.jwksUrl | quote }}
  JWT_JWKS_CONNECT_TIMEOUT_MS: {{ .Values.contentService.jwt.connectTimeoutMs | quote }}
  JWT_JWKS_READ_TIMEOUT_MS: {{ .Values.contentService.jwt.readTimeoutMs | quote }}
  JWT_JWKS_CACHE_TTL_SECONDS: {{ .Values.contentService.jwt.cacheTtlSeconds | quote }}
  IDENTITY_SERVICE_URL: {{ .Values.contentService.identityService.url | quote }}
  IDENTITY_SERVICE_CONNECT_TIMEOUT_MS: {{ .Values.contentService.identityService.connectTimeoutMs | quote }}
  IDENTITY_SERVICE_READ_TIMEOUT_MS: {{ .Values.contentService.identityService.readTimeoutMs | quote }}
  STUDY_SERVICE_URL: {{ .Values.contentService.studyService.url | quote }}
  STUDY_SERVICE_CONNECT_TIMEOUT_MS: {{ .Values.contentService.studyService.connectTimeoutMs | quote }}
  STUDY_SERVICE_READ_TIMEOUT_MS: {{ .Values.contentService.studyService.readTimeoutMs | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.contentService.kafka.bootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.contentService.kafka.securityProtocol | quote }}
  KAFKA_SASL_MECHANISM: {{ .Values.contentService.kafka.saslMechanism | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  TZ: {{ .Values.config.timezone | quote }}
