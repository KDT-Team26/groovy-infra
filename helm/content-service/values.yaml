contentService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: 665206375378.dkr.ecr.ap-northeast-2.amazonaws.com/groovy-content-service
    tag: "44e32d6e71234530dcb248336f9c19b0d1b51cd3"
    pullPolicy: IfNotPresent
  port: 8083
  # 롤아웃 안전장치 + health probe(#90) — 상세 설명은 identity-service/values.yaml 참고.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
    # 자동 롤백(auto-rollback P1c): 새 ReplicaSet이 이 시간 내 Available되지 않으면 배포 실패로
    # 간주 → ArgoCD Degraded. 실측 콜드스타트 최대 85s(docs/auto-rollback-coldstart-measurements.md)
    # 의 2.8x, startup 예산 180s 초과. 기본 600s 대비 감지 단축.
    progressDeadlineSeconds: 240
  probes:
    enabled: true
    startup:
      # DB/Flyway/Kafka 준비까지 포함한 통합 health. 실측 콜드스타트 ≤85s → 예산 180s(2.1x).
      httpGet: { path: /actuator/health, port: 8083 }
      periodSeconds: 10
      failureThreshold: 18
    readiness:
      # 자동 롤백(auto-rollback P1c): readiness 그룹만 — 외부 의존성 블립이 롤아웃을 막거나
      # 오탐 롤백을 유발하지 않게 한다.
      httpGet: { path: /actuator/health/readiness, port: 8083 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      # liveness 그룹만(프로세스 생존). 의존성 DOWN으로 컨테이너가 재시작되지 않게 한다.
      httpGet: { path: /actuator/health/liveness, port: 8083 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91) — 상세 설명은 identity-service/values.yaml 참고.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -Xss256k"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  database:
    host: groovy-rds-mysql.cjmu2is60j25.ap-northeast-2.rds.amazonaws.com
    port: 3306
    name: content_db
    username: content_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"
  jwt:
    jwksUrl: "http://identity-service:8081/.well-known/jwks.json"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
    cacheTtlSeconds: "300"
  identityService:
    url: "http://identity-service:8081"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  studyService:
    url: "http://study-service:8082"
    connectTimeoutMs: "2000"
    readTimeoutMs: "3000"
  kafka:
    bootstrapServers: "kafka:9092"
    securityProtocol: "SASL_PLAINTEXT"
    saslMechanism: "PLAIN"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"
