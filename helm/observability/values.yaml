kafkaExporter:
  replicaCount: 1
  image:
    repository: danielqsj/kafka-exporter
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 9308
  kafka:
    host: kafka.groovy-application.svc.cluster.local
    port: 9092
    username: "app"
    saslMechanism: "plain"
  resources:
    requests:
      cpu: "10m"
      memory: "24Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"

nodeExporter:
  image:
    repository: prom/node-exporter
    tag: "v1.12.1"
    pullPolicy: IfNotPresent
  port: 9100
  hostPaths:
    proc: /proc
    sys: /sys
    root: /
  filesystemMountPointsExclude: "^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"

prometheus:
  replicaCount: 1
  image:
    repository: prom/prometheus
    pullPolicy: IfNotPresent
    tag: "v2.53.0"
  port: 9090
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /prometheus
  resources:
    requests:
      cpu: "100m"
      memory: "400Mi"
    limits:
      cpu: "300m"
      memory: "768Mi"

grafana:
  replicaCount: 1
  image:
    repository: grafana/grafana
    pullPolicy: IfNotPresent
    tag: "11.1.0"
  port: 3000
  # 그라파나 UI 외부 노출(#193 B안 후속) — argocd-ingress.yaml/istio-gateway와 같은 방식으로
  # 기존 ALB를 IngressGroup으로 공유한다(전용 ALB 신설 아님). albGroupName이 비어있으면
  # templates/grafana-ingress.yaml이 아예 렌더링되지 않는다 — 지금 이 값을 커밋해도 실제
  # 적용 전까지는 영향 없음. 세 Ingress(istio-gateway/argocd/grafana)의 albGroupName은
  # 반드시 전부 동일해야 한다. 적용 순서는 docs/argocd-webhook-setup.md 참고.
  ingress:
    albGroupName: "groovy-shared-alb"
    domain: "grafana.groovy-team26.com"
    certificateArn: "arn:aws:acm:ap-northeast-2:665206375378:certificate/53b0e46b-f65d-4c8e-9944-a204b3b085a0"
  resources:
    requests:
      cpu: "30m"
      memory: "100Mi"
    limits:
      cpu: "150m"
      memory: "256Mi"

tempo:
  replicaCount: 1
  image:
    repository: grafana/tempo
    pullPolicy: IfNotPresent
    tag: "latest"
  httpPort: 3200
  otlpHttpPort: 4318
  liveStore:
    maxTraceIdle: "10s"
    maxBlockDuration: "5m"
  resources:
    requests:
      cpu: "200m"
      memory: "600Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

loki:
  replicaCount: 1
  image:
    repository: grafana/loki
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  port: 3100
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /loki
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

alloy:
  replicaCount: 1
  image:
    repository: grafana/alloy
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 12345
  resources:
    requests:
      cpu: "20m"
      memory: "96Mi"
    limits:
      cpu: "100m"
      memory: "192Mi"

config:
  grafanaAdminUser: "admin"
  timezone: "Asia/Seoul"

# prometheus-configmap.yaml의 스크레이프 대상 포트 — 각 서비스 차트가 고정으로 리스닝하는
# 포트라 차트가 분리돼도 값이 갈라질 위험은 없다.
identityService:
  port: 8081
studyService:
  port: 8082
contentService:
  port: 8083
calendarService:
  port: 8084
notificationService:
  port: 8085

alertmanager:
  replicaCount: 1
  image:
    repository: prom/alertmanager
    tag: "v0.28.1"
    pullPolicy: IfNotPresent
  port: 9093
  resources:
    requests:
      cpu: "10m"
      memory: "24Mi"
    limits:
      cpu: "50m"
      memory: "64Mi"
