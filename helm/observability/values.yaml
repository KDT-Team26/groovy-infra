mysqldExporter:
  replicaCount: 1
  image:
    repository: prom/mysqld-exporter
    tag: "v0.19.0"
    pullPolicy: IfNotPresent
  port: 9104
  mysql:
    host: mysql
    username: root

kafkaExporter:
  replicaCount: 1
  image:
    repository: danielqsj/kafka-exporter
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 9308
  kafka:
    host: kafka
    port: 9092
    username: "app"
    saslMechanism: "plain"

nodeExporter:
  image:
    repository: prom/node-exporter
    tag: "v1.12.1"
    pullPolicy: IfNotPresent
  port: 9100
  hostPaths:
    proc: /proc
    sys: /sys
    root: /
  filesystemMountPointsExclude: "^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"

prometheus:
  replicaCount: 1
  image:
    repository: prom/prometheus
    pullPolicy: IfNotPresent
    tag: "v2.53.0"
  port: 9090

grafana:
  replicaCount: 1
  image:
    repository: grafana/grafana
    pullPolicy: IfNotPresent
    tag: "11.1.0"
  port: 3000

tempo:
  replicaCount: 1
  image:
    repository: grafana/tempo
    pullPolicy: IfNotPresent
    tag: "latest"
  httpPort: 3200
  otlpHttpPort: 4318

loki:
  replicaCount: 1
  image:
    repository: grafana/loki
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  port: 3100
  persistence:
    enabled: true
    size: 10Gi
    mountPath: /loki

alloy:
  replicaCount: 1
  image:
    repository: grafana/alloy
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 12345

config:
  grafanaAdminUser: "admin"
  timezone: "Asia/Seoul"

# prometheus-configmap.yaml의 스크레이프 대상 포트 — 각 서비스 차트가 고정으로 리스닝하는
# 포트라 차트가 분리돼도 값이 갈라질 위험은 없다(api-gateway 차트의 동일한 스텁 값과 같은 이유).
apiGateway:
  managementPort: 8090
identityService:
  port: 8081
studyService:
  port: 8082
contentService:
  port: 8083
calendarService:
  port: 8084
notificationService:
  port: 8085

# mysqld-exporter-deployment.yaml이 mysql 접속 포트로 참조한다(platform 차트 소유 값의 사본).
mysql:
  port: 3306

alertmanager:
  replicaCount: 1
  image:
    repository: prom/alertmanager
    tag: "v0.28.1"
    pullPolicy: IfNotPresent
  port: 9093

sealedSecretData:
  grafanaAdminPassword: 
  # 예전엔 slackWebhookUrl(URL 한 줄)만 봉인했지만, discord_configs가 파일 참조를 지원하지
  # 않아(alertmanager-secret.yaml 주석 참고) alertmanager.yml 전체를 봉인한다(#65).
  # argocd/bootstrap/seal-secret-values.sh 실행 후 출력값으로 교체할 것 — 값을 채우지 않으면
  # alertmanager-secret.yaml의 `required` 검증에서 helm 렌더링 자체가 실패한다(의도된 동작).
  alertmanagerConfig: REPLACE_WITH_SEAL_SECRET_VALUES_SH_OUTPUT
  kafkaExporterPassword: 