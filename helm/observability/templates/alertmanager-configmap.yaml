apiVersion: v1
kind: ConfigMap
metadata:
  name: groovy-alertmanager-config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: "slack-notifications"

    receivers:
      - name: "slack-notifications"
        slack_configs:
          - api_url_file: "/etc/alertmanager/secrets/slack_webhook_url"
            channel: "#grafana-alert"
            send_resolved: true
