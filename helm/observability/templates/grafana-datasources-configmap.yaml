apiVersion: v1
kind: ConfigMap
metadata:
  name: groovy-grafana-datasources
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:{{ .Values.tempo.httpPort }}
        editable: true
        jsonData:
          httpMethod: GET

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:{{ .Values.loki.port }}
        editable: true
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"traceId":"([0-9a-f]+)"'
              name: TraceID
              url: "$${__value.raw}"
