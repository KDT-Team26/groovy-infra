# Sealed Secrets로 전환(2026-08-26) — 이유/사용법은 identity-service의 동일 파일 주석 참고.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-secret
  labels:
    app: grafana
spec:
  encryptedData:
    GF_SECURITY_ADMIN_PASSWORD: {{ required "sealedSecretData.grafanaAdminPassword is required — argocd/bootstrap/seal-secret-values.sh로 암호화한 값을 채울 것" .Values.sealedSecretData.grafanaAdminPassword | quote }}
  template:
    metadata:
      name: grafana-secret
      labels:
        app: grafana
    type: Opaque
