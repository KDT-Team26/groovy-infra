# ESO(External Secrets Operator)로 전환(1단계).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret
  labels:
    app: grafana
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: groovy/prod/observability
        property: GF_SECURITY_ADMIN_PASSWORD
