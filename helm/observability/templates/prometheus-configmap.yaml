apiVersion: v1
kind: ConfigMap
metadata:
  name: groovy-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert.rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager:{{ .Values.alertmanager.port }}"

    scrape_configs:
      # groovy-application 네임스페이스 서비스라 FQDN으로 스크레이프(2026-09-01, 네임스페이스 분리).
      - job_name: identity-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["identity-service.groovy-application.svc.cluster.local:{{ .Values.identityService.port }}"]

      - job_name: study-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["study-service.groovy-application.svc.cluster.local:{{ .Values.studyService.port }}"]

      - job_name: content-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["content-service.groovy-application.svc.cluster.local:{{ .Values.contentService.port }}"]

      - job_name: calendar-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["calendar-service.groovy-application.svc.cluster.local:{{ .Values.calendarService.port }}"]

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["notification-service.groovy-application.svc.cluster.local:{{ .Values.notificationService.port }}"]

      - job_name: tempo
        metrics_path: /metrics
        static_configs:
          - targets: ["tempo:{{ .Values.tempo.httpPort }}"]

      - job_name: kafka
        static_configs:
          - targets: ["kafka-exporter:{{ .Values.kafkaExporter.port }}"]

      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter:{{ .Values.nodeExporter.port }}"]

      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]
