apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  # PVC가 RWO/hostpath라 동시에 1개 pod만 TSDB 락을 잡을 수 있다. 기본 RollingUpdate(surge)는
  # 신규 pod가 구 pod와 동시에 같은 데이터 디렉토리를 열려다 "lock DB directory: resource
  # temporarily unavailable"로 크래시루프 → 구 pod는 신규가 Ready 안 되니 안 내려가는 롤아웃
  # 데드락에 빠진다. Recreate로 구 pod를 먼저 완전히 내린 뒤 신규를 띄운다(그동안 짧은 다운타임
  # 발생 — Prometheus는 replica=1 싱글턴이라 감수).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      #checksum annotation을 통해 ConfigMap이 변경될 때마다 Deployment가 rolling update 되도록 함
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
        checksum/alert-rules: {{ include (print $.Template.BasePath "/prometheus-alert-rules-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-alert-rules
              mountPath: /etc/prometheus/alert.rules.yml
              subPath: alert.rules.yml

            {{- if .Values.prometheus.persistence.enabled }}
            - name: prometheus-data
              mountPath: {{ .Values.prometheus.persistence.mountPath }}
            {{- end }}

      volumes:
        - name: prometheus-config
          configMap:
            name: groovy-prometheus-config
            
        - name: prometheus-alert-rules
          configMap:
            name: groovy-prometheus-alert-rules

        {{- if .Values.prometheus.persistence.enabled }}
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: groovy-prometheus-data
        {{- end }}
