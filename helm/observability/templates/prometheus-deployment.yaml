apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: {{ .Values.prometheus.replicaCount }}
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      #checksum annotation을 통해 ConfigMap이 변경될 때마다 Deployment가 rolling update 되도록 함
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-configmap.yaml") . | sha256sum }}
        checksum/alert-rules: {{ include (print $.Template.BasePath "/prometheus-alert-rules-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-alert-rules
              mountPath: /etc/prometheus/alert.rules.yml
              subPath: alert.rules.yml

            {{- if .Values.prometheus.persistence.enabled }}
            - name: prometheus-data
              mountPath: {{ .Values.prometheus.persistence.mountPath }}
            {{- end }}

      volumes:
        - name: prometheus-config
          configMap:
            name: groovy-prometheus-config
            
        - name: prometheus-alert-rules
          configMap:
            name: groovy-prometheus-alert-rules

        {{- if .Values.prometheus.persistence.enabled }}
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: groovy-prometheus-data
        {{- end }}
