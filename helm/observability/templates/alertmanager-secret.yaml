# Sealed Secrets로 관리 — alertmanager.yml 전체(라우팅 규칙 + Discord Webhook URL)를 하나의
# SealedSecret 값으로 봉인한다(#65, Slack -> Discord 전환).
#
# 예전엔 이 파일이 slack_webhook_url 하나만 담당했고, 실제 설정 텍스트는 별도 ConfigMap
# (alertmanager-configmap.yaml)에 평문으로 있었다 — slack_configs의 api_url_file(파일 경로
# 참조)로 URL만 분리할 수 있었기 때문. Discord의 discord_configs는 이 file 참조를 지원하지
# 않아서(prometheus/alertmanager#3482, 아직 미구현) webhook_url에 리터럴 값을 직접 넣어야
# 한다 — 그래서 ConfigMap을 없애고, helm/platform/templates/mysql-secret.yaml의
# provisionerInitSql과 같은 방식으로 설정 텍스트 전체를 SealedSecret 하나로 다룬다.
#
# 값 채우는 법: argocd/bootstrap/seal-secret-values.sh 실행 → 출력된
# "sealedSecretData: alertmanagerConfig: ..." 값을 이 차트의 values.yaml에 병합.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-secret
  labels:
    app: alertmanager
spec:
  encryptedData:
    alertmanager.yml: {{ required "sealedSecretData.alertmanagerConfig is required — argocd/bootstrap/seal-secret-values.sh로 암호화한 값을 채울 것" .Values.sealedSecretData.alertmanagerConfig | quote }}
  template:
    metadata:
      name: alertmanager-secret
      labels:
        app: alertmanager
    type: Opaque
