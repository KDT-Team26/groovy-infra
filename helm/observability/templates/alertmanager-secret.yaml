# Sealed Secrets로 전환 — 이유/사용법은 identity-service의 동일 파일 주석 참고.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-secret
  labels:
    app: alertmanager
spec:
  encryptedData:
    slack_webhook_url: {{ required "sealedSecretData.slackWebhookUrl is required — argocd/bootstrap/seal-secret-values.sh로 암호화한 값을 채울 것" .Values.sealedSecretData.slackWebhookUrl | quote }}
  template:
    metadata:
      name: alertmanager-secret
      labels:
        app: alertmanager
    type: Opaque
