# ESO(External Secrets Operator)로 전환(1단계) — Sealed Secrets 시절엔 alertmanager.yml
# 전체(라우팅 규칙 + Discord Webhook URL)를 완성된 문자열로 통째로 암호화해야 했지만(discord_configs가
# api_url_file을 지원하지 않아서), ESO의 target.template을 쓰면 Secrets Manager에는 webhook
# URL 원본 값 하나만 저장해두고 나머지 YAML은 여기서 조립하면 된다.
#
# ⚠️ groovy/prod/alertmanager 시크릿(키: discordWebhookUrl)이 아직 Secrets Manager에 없다.
# 실제 Discord Webhook URL 값을 팀에서 등록해야 이 ExternalSecret이 정상 동기화된다:
#   aws secretsmanager create-secret --name groovy/prod/alertmanager \
#     --secret-string '{"discordWebhookUrl":"<실제 웹훅 URL>"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
  labels:
    app: alertmanager
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: alertmanager-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m

          route:
            receiver: "discord-notifications"

          receivers:
            - name: "discord-notifications"
              discord_configs:
                - webhook_url: "{{ "{{" }} .discordWebhookUrl {{ "}}" }}"
                  send_resolved: true
  data:
    - secretKey: discordWebhookUrl
      remoteRef:
        key: groovy/prod/alertmanager
        property: discordWebhookUrl
