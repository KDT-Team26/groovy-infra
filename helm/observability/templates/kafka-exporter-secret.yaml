# ESO(External Secrets Operator)로 전환(1단계). groovy/prod/kafka-exporter는 기존 Kafka
# application 계정 비밀번호(groovy/prod/kafka의 app-jaas-config)를 재사용해 만들어둔 값이다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-exporter-secret
  labels:
    app: kafka-exporter
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: kafka-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: groovy/prod/kafka-exporter
        property: KAFKA_PASSWORD
