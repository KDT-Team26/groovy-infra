apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: {{ .Values.alertmanager.replicaCount }}
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
          ports:
            - containerPort: {{ .Values.alertmanager.port }}
              protocol: TCP
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml

      # alertmanager.yml 자체가 Discord Webhook URL을 담은 SealedSecret이라(#65 — discord_configs가
      # slack_configs의 api_url_file 같은 파일 참조를 지원하지 않아 URL을 리터럴로 넣어야 함),
      # 예전처럼 ConfigMap+별도 Secret 두 볼륨으로 나눌 필요 없이 이 Secret 하나만 마운트한다.
      volumes:
        - name: alertmanager-config
          secret:
            secretName: alertmanager-secret
