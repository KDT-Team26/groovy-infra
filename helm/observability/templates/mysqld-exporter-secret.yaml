# mysqld-exporter-deployment.yaml이 secretKeyRef로 직접 참조하는 <name>-mysql-secret은
# k8s Secret이라 네임스페이스를 못 넘는다 — platform 차트가 groovy-application에 만드는
# 것과 이름은 같지만 별개 오브젝트로, groovy-monitoring에도 똑같이 하나 더 만들어야 한다
# (네임스페이스 분리 때 놓쳤던 부분, 2026-09-02 실배포 중 발견).
{{- range $name, $instance := .Values.mysqldExporter.instances }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-mysql-secret
  labels:
    app: {{ $name }}-mysqld-exporter
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: {{ $name }}-mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: groovy/legacy/mysql-{{ $name }}
        property: rootPassword
{{- end }}
