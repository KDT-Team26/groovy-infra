# 예전엔 이 예시 파일이 요구하는 키를 실제 값으로 채워 values-secret.yaml(gitignore)로 만들어야
# 했는데, 그 파일은 ArgoCD의 repo-server가 못 읽는 문제가 있었다. 이제는 값 자체를 암호화해서
# 이 차트의 values.yaml에 있는 sealedSecretData.* 아래에 직접 넣는다(암호화됐으니 git에 노출돼도
