# ESO(External Secrets Operator)로 전환(1단계) — AWS Secrets Manager에서 직접 값을 가져와
# 이 이름의 일반 Secret으로 동기화한다. Deployment의 envFrom(secretRef: identity-service-secret)은
# 그대로 유지되므로 배포 쪽은 수정할 필요가 없다.
#
# JWT_PRIVATE_KEY_PEM(#116): identity-service JWT 서명키를 replica 전체가 공유하기 위한 고정
# RSA 키. groovy/prod/identity-jwt에 저장. 로테이션하면 기존 발급 토큰이 전부 무효화되므로
# (전체 재로그인 필요) 의도한 로테이션이 아니면 그 시크릿 값을 바꾸지 말 것.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-secret
  labels:
    app: identity-service
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: identity-service-secret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DEV_DB_PASSWORD
      remoteRef:
        key: groovy/rds/identity
        property: password
    - secretKey: JWT_PRIVATE_KEY_PEM
      remoteRef:
        key: groovy/prod/identity-jwt
        property: JWT_PRIVATE_KEY_PEM
