# Sealed Secrets로 전환(2026-08-26) — 예전엔 이 Secret을 .Values.secret.identityService.dbPassword로
# 직접 렌더링했는데, 그 값은 gitignore된 values-secret.yaml에만 존재해서 ArgoCD의 repo-server가
# 못 읽고(gitignore된 파일은 clone에도 안 잡힘) helm template 자체가 required 가드에서 실패했다.
#
# 이제 값 자체를 암호화해서(sealed-secrets 컨트롤러의 공개키로) 평범한 values.yaml에 넣는다 —
# 암호화된 문자열은 그 클러스터만 복호화 가능해서 git에 노출돼도 안전하다.
#
# 값 채우는 법: argocd/bootstrap/seal-secret-values.sh 참고. 요약하면
#   kubectl create secret generic identity-service-secret -n groovy-kubernates \
#     --dry-run=client --from-literal=SPRING_DEV_DB_PASSWORD=<실제값> -o yaml | kubeseal --format yaml
# 출력된 encryptedData.SPRING_DEV_DB_PASSWORD 값을 helm/identity-service/values.yaml의
# sealedSecretData.identityService.dbPassword에 붙여넣는다.
#
# JWT_PRIVATE_KEY_PEM(#116): identity-service JWT 서명키를 replica 전체가 공유하기 위한 고정
# RSA 키. envFrom(secretRef)으로 이 Secret 전체를 주입받으므로 Deployment 템플릿 수정 없이 새
# 환경변수가 자동으로 추가된다. 값 채우는 법은 argocd/bootstrap/generate-identity-jwt-key.sh 참고.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: identity-service-secret
  labels:
    app: identity-service
spec:
  encryptedData:
    SPRING_DEV_DB_PASSWORD: {{ required "sealedSecretData.identityService.dbPassword is required — argocd/bootstrap/seal-secret-values.sh로 암호화한 값을 채울 것" .Values.sealedSecretData.identityService.dbPassword | quote }}
    JWT_PRIVATE_KEY_PEM: {{ required "sealedSecretData.identityService.jwtPrivateKeyPem is required — argocd/bootstrap/generate-identity-jwt-key.sh로 생성한 값을 채울 것" .Values.sealedSecretData.identityService.jwtPrivateKeyPem | quote }}
  template:
    metadata:
      name: identity-service-secret
      labels:
        app: identity-service
    type: Opaque
