apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: identity-rds-secrets
spec:
  provider: aws
  secretObjects:
    - secretName: identity-rds-secret
      type: Opaque
      data:
        - objectName: username
          key: SPRING_DEV_DB_USERNAME
        - objectName: password
          key: SPRING_DEV_DB_PASSWORD
  parameters:
    region: ap-northeast-2
    usePodIdentity: "true"
    objects: |
      - objectName: "groovy/rds/identity"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"