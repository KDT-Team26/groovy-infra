identityService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: 665206375378.dkr.ecr.ap-northeast-2.amazonaws.com/groovy-identity-service
    tag: "3e29a95a1a0ed85812d2f45ea03ce1ee767d5edd"
    # 태그가 sha 고정이라 K8s 기본값은 IfNotPresent지만, 6개 서비스 간 일관성을 위해 명시.
    pullPolicy: IfNotPresent
  port: 8081
  # 롤아웃 안전장치(#90): revisionHistoryLimit 로 되돌릴 ReplicaSet 이력 보존,
  # maxUnavailable:0 으로 새 Pod가 Ready 되기 전엔 구 Pod 유지.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
  # health probe(#90). 각 probe 는 완결된 k8s probe 스펙이라 템플릿은 toYaml 로 그대로 렌더.
  # startup.failureThreshold * periodSeconds = 최대 허용 기동시간(여기선 300s).
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91). 기본은 비활성 — 활성 값은 values-ha.yaml 에 있고,
  # argocd/apps/identity-service.yaml 의 helm.valueFiles 에 - values-ha.yaml 을 추가하면 덮어쓴다.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  # CPU 용량 확충(#119) — 부하테스트 실측으로 500m limit에 pinned되어 30rps/30s 목표가 123s
  # 걸리고 p50 6.7~8s까지 튀는 걸 확인. 클러스터 실사용률(request 기준 45%)에 여유 있어 상향.
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # TieredStopAtLevel=1(#119): C2 JIT 컴파일 생략 — 콜드스타트 시 CPU 스파이크 감소 목적.
  # steady-state CPU가 4~12%대라 처리량 트레이드오프 영향은 적음. ActiveProcessorCount는
  # 500m limit 기준 기본값이 이미 1이라(올림 처리) 추가해도 no-op이라 제외.
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k -XX:TieredStopAtLevel=1"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: groovy-rds-mysql.cjmu2is60j25.ap-northeast-2.rds.amazonaws.com
    port: 3306
    name: identity_db
    username: identity_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"
