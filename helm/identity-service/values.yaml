identityService:
  replicaCount: 1 # HA 전환(#91) 시 2 이상. 현재는 미니 PC 자원 제약으로 1 고정
  image:
    repository: ttt103/groovy-identity-service
    tag: "2d78f0917d5ef0d3a8e05c45086f5844955d168f"
    # 태그가 sha 고정이라 K8s 기본값은 IfNotPresent지만, 6개 서비스 간 일관성을 위해 명시.
    pullPolicy: IfNotPresent
  port: 8081
  # 롤아웃 안전장치(#90): revisionHistoryLimit 로 되돌릴 ReplicaSet 이력 보존,
  # maxUnavailable:0 으로 새 Pod가 Ready 되기 전엔 구 Pod 유지.
  rollout:
    revisionHistoryLimit: 5
    maxUnavailable: 0
    maxSurge: 1
  # health probe(#90). 각 probe 는 완결된 k8s probe 스펙이라 템플릿은 toYaml 로 그대로 렌더.
  # startup.failureThreshold * periodSeconds = 최대 허용 기동시간(여기선 300s).
  probes:
    enabled: true
    startup:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 10
      failureThreshold: 30
    readiness:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      httpGet: { path: /actuator/health, port: 8081 }
      periodSeconds: 20
      failureThreshold: 3
      timeoutSeconds: 3
  # HA 프로파일(#91). 기본은 비활성 — 활성 값은 values-ha.yaml 에 있고,
  # argocd/apps/identity-service.yaml 의 helm.valueFiles 에 - values-ha.yaml 을 추가하면 덮어쓴다.
  pdb:
    enabled: false
    minAvailable: 1
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-XX:MaxRAMPercentage=50.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: identity-mysql
    port: 3306
    name: identity_db
    username: identity_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"

sealedSecretData:
  identityService:
    dbPassword: 
