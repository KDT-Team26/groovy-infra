identityService:
  replicaCount: 1
  image:
    repository: ttt103/groovy-identity-service
    tag: "2d78f0917d5ef0d3a8e05c45086f5844955d168f"
  port: 8081
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  database:
    host: mysql
    port: 3306
    name: identity_db
    username: identity_service
    parameters: "useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  dbPool:
    maxSize: "10"
    minIdle: "2"

config:
  corsAllowedOrigins: "http://localhost:5173"
  timezone: "Asia/Seoul"

sealedSecretData:
  identityService:
    dbPassword: 
