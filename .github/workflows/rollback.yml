# 수동 롤백 워크플로 (break-glass)
#
# 배포본이 장애를 유발했을 때 해당 서비스의 이미지 태그를 되돌린다.
# 사람이 이 워크플로를 실행한 것 자체가 main 직접 push 에 대한 승인이다.
# 자동 롤백은 deploy-verify.yml 이 같은 코어 로직(.github/actions/rollback-core)을 호출한다.

name: Rollback service image tag

on:
  workflow_dispatch:
    inputs:
      service:
        description: 롤백할 서비스(= helm/<service> 디렉토리명)
        required: true
        type: choice
        options:
          - identity-service
          - study-service
          - calendar-service
          - content-service
          - notification-service
      to_sha:
        description: 되돌릴 이미지 태그(git sha). 비우면 last-good/<service> 태그 기준.
        required: false
        type: string
      reason:
        description: 롤백 사유(커밋 메시지에 기록됨)
        required: true
        type: string
      dry_run:
        description: true 면 push 없이 목표 태그와 diff 만 출력
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # OIDC 로 ECR 이미지 존재 검증용 IAM 역할 assume

concurrency:
  group: rollback-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout groovy-infra main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # last-good 태그 조회 / rebase 를 위해 전체 이력 필요

      - name: Configure AWS credentials (OIDC)
        continue-on-error: true   # 역할 미구성(P3 이전)이어도 워크플로는 진행 — rollback-core 가 경고 후 skip
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-eks-readonly
          aws-region: ap-northeast-2

      - name: Roll back
        id: rb
        uses: ./.github/actions/rollback-core
        with:
          service: ${{ inputs.service }}
          to_sha: ${{ inputs.to_sha }}
          reason: ${{ inputs.reason }}
          dry_run: ${{ inputs.dry_run }}
          actor: "@${{ github.actor }} via rollback.yml"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.rb.outcome }}
          CURRENT: ${{ steps.rb.outputs.current }}
          TARGET: ${{ steps.rb.outputs.target }}
          COMMITTED: ${{ steps.rb.outputs.committed }}
        run: |
          {
            echo "### 롤백 결과: \`${OUTCOME}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| service | \`${{ inputs.service }}\` |"
            echo "| from | \`${CURRENT:-?}\` |"
            echo "| to | \`${TARGET:-?}\` |"
            echo "| reason | ${{ inputs.reason }} |"
            echo "| committed | \`${COMMITTED:-false}\` |"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "> dry-run 이라 push 하지 않았습니다."
            elif [ "${COMMITTED:-false}" = "true" ]; then
              echo "> main 에 push 됨. ArgoCD 가 다음 sync(폴링 ~3분) 때 이전 이미지로 재배포합니다."
            else
              echo "> ⚠️ 롤백이 완료되지 않았습니다. 로그를 확인하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "${DISCORD_WEBHOOK_URL:-}" ] || { echo "DISCORD_WEBHOOK_URL 미설정 — 알림 skip"; exit 0; }
          curl -sS -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @- <<JSON
          { "content": "🚨 **rollback.yml 실패** — service=\`${{ inputs.service }}\`, actor=\`${{ github.actor }}\`\n로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
          JSON
