# 롤백 코어 로직 (composite action)
#
# rollback.yml(수동 break-glass)과 deploy-verify.yml(자동)이 공유한다.
# 하는 일: 대상 태그 해석 → values.yaml 치환 → helm 렌더 검증 → main 에 rebase-safe push.
#
# 호출 측 전제조건:
#   - actions/checkout 으로 groovy-infra main 이 fetch-depth: 0 으로 체크아웃돼 있을 것
#   - (선택) AWS 자격증명이 구성돼 있으면 ECR 이미지 존재를 강제 검증, 없으면 경고 후 skip
#   - helm 은 없으면 이 액션이 설치한다

name: rollback-core
description: groovy-infra 서비스 이미지 태그를 안전하게 되돌린다

inputs:
  service:
    description: 대상 서비스 (= helm/<service> 디렉토리명)
    required: true
  to_sha:
    description: 되돌릴 이미지 태그(git sha). 비우면 last-good/<service> 태그 기준.
    required: false
    default: ""
  reason:
    description: 롤백 사유 (커밋 메시지에 기록)
    required: true
  dry_run:
    description: "true 면 push 없이 목표 태그와 diff 만 출력"
    required: false
    default: "false"
  actor:
    description: 트리거 주체 (커밋 메시지에 기록)
    required: false
    default: "unknown"
  aws_region:
    description: ECR 리전
    required: false
    default: ap-northeast-2

outputs:
  current:
    description: 롤백 전 태그
    value: ${{ steps.resolve.outputs.current }}
  target:
    description: 롤백 목표 태그
    value: ${{ steps.resolve.outputs.target }}
  committed:
    description: "실제로 커밋·push 되었으면 true"
    value: ${{ steps.push.outputs.committed }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TO_SHA: ${{ inputs.to_sha }}
      run: |
        set -euo pipefail
        # service: 셸 주입 방지 위해 env 로만 받고, 화이트리스트 대신 실제 디렉토리 존재로 검증
        case "$SERVICE" in
          */*|"") echo "::error::service 값이 올바르지 않습니다: '$SERVICE'"; exit 1 ;;
        esac
        test -d "helm/${SERVICE}" || { echo "::error::helm/${SERVICE} 디렉토리가 없습니다"; exit 1; }
        test -f "helm/${SERVICE}/values.yaml" || { echo "::error::helm/${SERVICE}/values.yaml 이 없습니다"; exit 1; }
        if [ -n "$TO_SHA" ] && ! printf '%s' "$TO_SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
          echo "::error::to_sha 는 7~40자리 hex(git sha)여야 합니다: '$TO_SHA'"
          exit 1
        fi

    - name: Resolve target tag
      id: resolve
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TO_SHA: ${{ inputs.to_sha }}
      run: |
        set -euo pipefail
        FILE="helm/${SERVICE}/values.yaml"

        # 현재 태그 (작업 트리 기준)
        CURRENT=$(grep -E '^    tag: ' "$FILE" | head -1 | sed -E 's/^    tag: "?([^"]*)"?.*/\1/')
        [ -n "$CURRENT" ] || { echo "::error::${FILE} 에서 현재 tag 를 찾지 못했습니다"; exit 1; }
        echo "현재 태그: $CURRENT"

        if [ -n "$TO_SHA" ]; then
          TARGET="$TO_SHA"
          echo "목표 태그(수동 지정): $TARGET"
        else
          # last-good/<service> 태그가 가리키는 커밋 시점의 values.yaml 태그 = 마지막으로
          # Healthy 로 검증된 이미지. deploy-verify.yml(P4)이 이 태그를 관리한다.
          git fetch origin "refs/tags/last-good/${SERVICE}:refs/tags/last-good/${SERVICE}" --force 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/last-good/${SERVICE}" >/dev/null; then
            TARGET=$(git show "refs/tags/last-good/${SERVICE}:${FILE}" \
                     | grep -E '^    tag: ' | head -1 | sed -E 's/^    tag: "?([^"]*)"?.*/\1/')
            echo "목표 태그(last-good): $TARGET"
          else
            echo "::error::last-good/${SERVICE} 태그가 없습니다. to_sha 를 직접 지정하세요."
            exit 1
          fi
        fi
        [ -n "$TARGET" ] || { echo "::error::목표 태그를 해석하지 못했습니다"; exit 1; }

        if [ "$CURRENT" = "$TARGET" ]; then
          echo "::error::현재 태그와 목표 태그가 같습니다($CURRENT). 롤백할 것이 없습니다."
          exit 1
        fi
        {
          echo "file=$FILE"
          echo "current=$CURRENT"
          echo "target=$TARGET"
        } >> "$GITHUB_OUTPUT"

    - name: Verify target image exists in ECR
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ steps.resolve.outputs.target }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: |
        set -euo pipefail
        if ! command -v aws >/dev/null 2>&1 || ! aws sts get-caller-identity >/dev/null 2>&1; then
          echo "::warning::AWS 자격증명 없음 — ECR 이미지 존재 검증을 건너뜁니다(P3에서 강제됨)."
          exit 0
        fi
        if aws ecr describe-images --region "$AWS_REGION" \
             --repository-name "groovy-${SERVICE}" \
             --image-ids imageTag="$TARGET" >/dev/null 2>&1; then
          echo "ECR 이미지 확인: groovy-${SERVICE}:${TARGET}"
        else
          echo "::error::ECR 에 groovy-${SERVICE}:${TARGET} 이미지가 없습니다. 롤백하면 ImagePullBackOff 가 됩니다."
          exit 1
        fi

    - name: Rewrite image tag
      shell: bash
      env:
        FILE: ${{ steps.resolve.outputs.file }}
        TARGET: ${{ steps.resolve.outputs.target }}
      run: |
        set -euo pipefail
        # TARGET 은 앞에서 hex 로 검증됨 → sed 구분자 안전
        sed -i -E "s|^(    tag: ).*|\1\"${TARGET}\"|" "$FILE"
        echo "----- diff -----"
        git --no-pager diff -- "$FILE"
        if git diff --quiet -- "$FILE"; then
          echo "::error::변경 사항이 없습니다"
          exit 1
        fi

    - name: Validate chart still renders
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
      run: |
        set -euo pipefail
        if ! command -v helm >/dev/null 2>&1; then
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash >/dev/null
        fi
        ARGS=(template "$SERVICE" "./helm/${SERVICE}" -f "./helm/${SERVICE}/values.yaml")
        # ArgoCD Application 이 실제로 쓰는 valueFiles 와 동일하게 렌더 (5개 서비스 모두 HA 오버레이 사용)
        [ -f "./helm/${SERVICE}/values-ha.yaml" ] && ARGS+=(-f "./helm/${SERVICE}/values-ha.yaml")
        helm "${ARGS[@]}" >/dev/null
        echo "helm template OK"

    - name: Commit & push to main (rebase-safe)
      id: push
      shell: bash
      env:
        FILE: ${{ steps.resolve.outputs.file }}
        SERVICE: ${{ inputs.service }}
        CURRENT: ${{ steps.resolve.outputs.current }}
        TARGET: ${{ steps.resolve.outputs.target }}
        REASON: ${{ inputs.reason }}
        ACTOR: ${{ inputs.actor }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        if [ "$DRY_RUN" = "true" ]; then
          echo "dry-run — push 하지 않습니다."
          echo "committed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git config user.name  "rollback-bot"
        git config user.email "rollback-bot@users.noreply.github.com"
        git add "$FILE"
        # 사유는 env 로만 참조 → 셸 주입 불가
        git commit -m "revert(${SERVICE}): roll back image tag to ${TARGET}" \
                   -m "from: ${CURRENT}" \
                   -m "reason: ${REASON}" \
                   -m "triggered by: ${ACTOR} (auto-rollback)"
        # 롤백 도중 서비스 CI 가 다른 태그 bump 를 push 하는 레이스에 대비: fetch+rebase 후 재시도
        for i in 1 2 3; do
          if git push origin HEAD:main; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push 실패 (시도 $i/3) — origin/main 재동기화 후 재시도"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error::origin/main 과 rebase 충돌 — 최근 배포가 같은 파일을 건드렸습니다. 수동 확인 필요."
            exit 1
          fi
          sleep 3
        done
        echo "::error::3회 재시도 후에도 push 실패"
        exit 1
