# MSA 전환 Phase 10: Kafka 컨테이너 자체 헬스체크(kafka-broker-api-versions.sh)가 이제
# SASL 인증을 거쳐야 하는 리스너에 붙어야 해서 필요한 자격증명 파일이다.
# docker-compose.msa.yml의 KAFKA_BROKER_PASSWORD 기본값(broker-secret)과 반드시 같은 값이어야
# 한다 — 이 파일은 정적 파일이라 compose의 ${VAR:-default} 치환이 적용되지 않는다. 로컬
# 검증 전용 휘발성 스택이라 고정값으로 둔다(mysql-init/*.sql과 동일한 이유/한계).
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret";
