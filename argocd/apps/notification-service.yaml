# sync wave 3 — study/calendar/content-service가 발행하는 Kafka 이벤트의 소비자라 순서상 굳이
# 늦게 뜰 필요는 없지만(그 서비스들의 REST API에 의존하지 않음), 지시서 계획대로 같은 wave에 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/notification-service
    helm:
      valueFiles:
        - values.yaml
        # - values.amd64.yaml  # mini PC가 amd64라면 주석 해제
        # values-secret.yaml(secret.notificationService.dbPassword)은 별도 주입 필요, platform과 값 일치.
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
