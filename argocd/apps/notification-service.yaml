# sync wave 3 — study/calendar/content-service가 발행하는 Kafka 이벤트의 소비자라 순서상 굳이
# 늦게 뜰 필요는 없지만(그 서비스들의 REST API에 의존하지 않음), 지시서 계획대로 같은 wave에 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/notification-service
    helm:
      valueFiles:
        - values.yaml
        # values.amd64.yaml는 삭제함(2026-08-26) — CI가 GitHub Actions 러너(amd64) 기준으로만
        # 빌드해서 values.yaml의 image.tag가 이미 amd64 이미지다. 오버라이드가 CI가 갱신한
        # 정확한 sha 태그를 빌드된 적 없는 옛 태그로 덮어써 ImagePullBackOff를 냈던 게 원인이었다.
        # 시크릿(secret.notificationService.dbPassword)은 Sealed Secrets로 전환됨(2026-08-26) — 이
        # values.yaml의 sealedSecretData.notificationService.dbPassword에 암호화된 값을 직접 넣는다
        # (argocd/bootstrap/seal-secret-values.sh). platform과 원본 값이 일치해야 함.
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
