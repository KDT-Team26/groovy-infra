# sync wave 5 — 마지막. prometheus가 각 서비스의 /actuator/prometheus를 스크레이프하므로 그
# 서비스들이 먼저 떠 있는 편이 낫고, mysqld-exporter도 platform(mysql)에 의존한다.
# Alertmanager는 Prometheus 알림 규칙·Slack 연동 작업이 끝나 이 차트에 포함됨(#30).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/observability
    helm:
      valueFiles:
        - values.yaml
        # 시크릿(grafana admin, alertmanager discord webhook, kafka-exporter)은 ESO(External
        # Secrets Operator)로 관리한다(1단계 전환 완료) — groovy/prod/observability,
        # groovy/prod/alertmanager, groovy/prod/kafka-exporter(Secrets Manager)에서 직접
        # 값을 가져와 동기화한다. alertmanager는 실제 Discord Webhook 값이 아직 없어 sync 실패
        # 중일 수 있다(의도된 상태, 값 채우면 자동 정상화).
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 2026-08-26: 대시보드 JSON들(특히 integration_dashboard.json 4200줄+)이 커지면서
      # groovy-grafana-dashboards ConfigMap을 client-side apply로 적용하면
      # kubectl.kubernetes.io/last-applied-configuration 어노테이션이 256KB 제한을 넘어
      # sync가 계속 실패했다(ArgoCD 자체 설치 때 겪은 CRD 크기 문제와 동일 원인).
      # server-side apply는 그 어노테이션을 안 쓰므로 리소스 크기와 무관하게 안전하다.
      - ServerSideApply=true
