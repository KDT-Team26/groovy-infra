# sync wave 2 — identity-service의 JWKS/사용자·태그 API에 의존하므로 그 다음에 뜬다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: study-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/study-service
    helm:
      valueFiles:
        - values.yaml
        # - values.amd64.yaml  # mini PC가 amd64라면 주석 해제
        # values-secret.yaml(secret.studyService.dbPassword)은 별도 주입 필요, platform과 값 일치.
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
