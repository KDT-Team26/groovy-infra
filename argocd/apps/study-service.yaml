# sync wave 2 — identity-service의 JWKS/사용자·태그 API에 의존하므로 그 다음에 뜬다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: study-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/study-service
    helm:
      valueFiles:
        - values.yaml
        - values-ha.yaml  # HA 프로파일 활성화(2026-09-01 결정) — replicaCount=2/HPA minReplicas=2
        # values.amd64.yaml는 삭제함(2026-08-26) — CI가 GitHub Actions 러너(amd64) 기준으로만
        # 빌드해서 values.yaml의 image.tag가 이미 amd64 이미지다. 오버라이드가 CI가 갱신한
        # 정확한 sha 태그를 빌드된 적 없는 옛 태그로 덮어써 ImagePullBackOff를 냈던 게 원인이었다.
        # 시크릿은 ESO(External Secrets Operator)로 관리한다(1단계 전환 완료) — 이 차트의
        # study-service-secret은 ExternalSecret이 groovy/rds/study(Secrets Manager)에서
        # 직접 값을 가져와 동기화한다. values.yaml에 값을 넣을 필요 없음.
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
