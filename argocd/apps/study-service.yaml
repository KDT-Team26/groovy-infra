# sync wave 2 — identity-service의 JWKS/사용자·태그 API에 의존하므로 그 다음에 뜬다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: study-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/study-service
    helm:
      valueFiles:
        - values.yaml
        # - values.amd64.yaml  # mini PC가 amd64라면 주석 해제
        # values-secret.yaml(secret.studyService.dbPassword)은 별도 주입 필요, platform과 값 일치.
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
