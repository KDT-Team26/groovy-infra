# External Secrets Operator(ESO) — AWS Secrets Manager의 groovy/* 시크릿을 읽어 각 네임스페이스에
# 일반 k8s Secret으로 동기화한다. metrics-server/kube-state-metrics와 동일하게 공식 Helm chart를
# ArgoCD가 직접 받아오게 해서 선언적으로 관리한다.
#
# 인증은 Pod Identity(역할: groovy-eso-secrets-role, terraform/eso.tf)로 처리 — 이 서비스어카운트
# (external-secrets/external-secrets)에 이미 연결되어 있다. sync-wave 0으로 다른 서비스보다
# 먼저 뜨게 한다 — 9개 서비스 Application의 ExternalSecret이 이 오퍼레이터에 의존한다.
#
# ClusterSecretStore(argocd/bootstrap/external-secrets-clustersecretstore.yaml)는 이 오퍼레이터의
# CRD가 먼저 설치돼야 적용 가능한 리소스라 GitOps 대상이 아니라 부트스트랩 스크립트에서 별도 적용.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.10.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
