# sync wave 0 — mysql/redis/kafka + DB init Job(PreSync). 다른 모든 서비스가 이 위에서 돈다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/platform
    helm:
      valueFiles:
        - values.yaml
        # 시크릿(mysqlRootPassword, mysql.provisionerPassword, 5개 서비스 dbPassword, kafka
        # 자격증명)은 Sealed Secrets로 전환됨(2026-08-26) — 이 values.yaml의 sealedSecretData.*
        # 아래에 암호화된 값을 직접 넣는다(argocd/bootstrap/seal-secret-values.sh). 값이 없으면
        # mysql-secret.yaml 등의 `required` 검증에서 sync가 실패한다(의도된 동작).
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
