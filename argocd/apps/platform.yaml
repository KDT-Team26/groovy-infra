# sync wave 0 — mysql/redis/kafka + DB init Job(PreSync). 다른 모든 서비스가 이 위에서 돈다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/platform
    helm:
      valueFiles:
        - values.yaml
        # 시크릿(mysql root/provisioner, kafka 자격증명, db-init SQL)은 ESO(External Secrets
        # Operator)로 관리한다(1단계 전환 완료) — mysql-secret/kafka-secret/db-init-secret이
        # 전부 ExternalSecret이라 groovy/legacy/mysql-<instance>, groovy/prod/kafka,
        # groovy/rds/<service>(Secrets Manager)에서 직접 값을 가져와 동기화한다.
  # 운영 서버 실제 배포 네임스페이스는 groovy-application이다(2026-09-01, 어플리케이션/
  # 모니터링 네임스페이스 분리 결정 — 멘토 피드백 반영). platform(mysql/kafka/redis)까지
  # 포함해 8개 Application이 여기로 통일되어야 서비스 간 short-name DNS가 계속 해석된다.
  # groovy-monitoring(observability)과의 상호 참조는 FQDN(<svc>.<ns>.svc.cluster.local)으로 처리.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
