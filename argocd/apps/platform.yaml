# sync wave 0 — mysql/redis/kafka + DB init Job(PreSync). 다른 모든 서비스가 이 위에서 돈다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/platform
    helm:
      valueFiles:
        - values.yaml
        # values-secret.yaml(mysqlRootPassword, mysql.provisionerPassword, 5개 서비스
        # dbPassword, kafka 자격증명)은 .gitignore 대상이라 이 레포 경로에서 읽을 수 없다.
        # 최초 sync 전에 반드시 별도 경로로 실제 값을 주입해야 한다 — 방법(예: ArgoCD가 접근
        # 가능한 프라이빗 값 저장소, 혹은 클러스터에 Secret을 미리 kubectl apply)은 Phase 05/06에서
        # 확정한다. 이 값이 없으면 mysql-secret.yaml 등의 `required` 검증에서 sync가 실패한다.
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
