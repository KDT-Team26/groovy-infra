# JWT 발급자. platform(mysql)이 떠 있어야 하고, 나머지 서비스가 이 서비스의
# JWKS를 참조하므로 가장 먼저 뜬다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/identity-service
    helm:
      valueFiles:
        - values.yaml
        - values-ha.yaml  # HA 프로파일 활성화(2026-09-01 결정) — replicaCount=2/HPA minReplicas=2

  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
