# sync wave 4 — api-gateway 뒤에 뜬다(프론트가 게이트웨이 주소로만 API를 호출하므로).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/frontend
    helm:
      valueFiles:
        - values.yaml
        # - values.amd64.yaml  # mini PC가 amd64라면 주석 해제(기본 values.yaml의 frontend 태그는
        # arm64 기준이라, amd64 오버라이드는 특이하게 태그에 접미사가 없다 — values.amd64.yaml 참고)
        # 이 차트는 values-secret가 없다(정적 SPA, DB/시크릿 의존 없음).
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
