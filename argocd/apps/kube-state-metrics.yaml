# kube-state-metrics — Kubernetes API 객체들(Deployment, Pod, Service 등)의 상태 메트릭을 생성하여 Prometheus가 수집하도록 함.
# metrics-server와 마찬가지로 공식 Helm chart를 ArgoCD가 직접 받아오게 해서 선언적으로 관리.
# Prometheus ConfigMap에 이미 `kube-state-metrics.kube-system.svc` 경로로 스크레이프 타겟이 지정되어 있으므로
# namespace는 `kube-system`으로 배포해야 정상 연동됩니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    # 현재 시점의 안정 버전을 지정합니다 (필요시 `helm search repo`로 확인 후 수정 가능)
    targetRevision: "5.26.0"
    helm:
      values: |
        # 특별히 추가 옵션이 필요하지 않다면 빈 상태로 두거나 기본값 적용
        prometheusScrape: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
