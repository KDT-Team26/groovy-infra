# sync wave 3 — 라우팅 대상 5개 서비스(identity/study/content/calendar/notification)가 이미
# 떠 있어야 실제 트래픽이 정상 프록시된다. contract-test가 없어(TODO 참고) 배포 자체엔 선행조건이
# 없지만, 라우팅 대상과 함께 뜨도록 같은 wave에 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/api-gateway
    helm:
      valueFiles:
        - values.yaml
        - values.amd64.yaml  # mini PC 확정: amd64 (2026-08-26)
        # 이 차트는 values-secret가 없다(라우팅 전용, DB/시크릿 의존 없음).
  # 운영 서버 실제 배포 네임스페이스는 default가 아니라 groovy-kubernates다(팀장님이 별도
  # 구축한 네임스페이스, Grafana 관측 대상도 이 기준). 9개 Application 전부 여기로 통일해야
  # 서비스 간 short-name DNS(mysql, identity-service 등)가 같은 네임스페이스 안에서 계속
  # 해석된다 — 하나라도 다른 네임스페이스로 빠지면 그 서비스만 접속이 끊긴다.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-kubernates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
