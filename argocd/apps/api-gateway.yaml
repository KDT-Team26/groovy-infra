# sync wave 3 — 라우팅 대상 5개 서비스(identity/study/content/calendar/notification)가 이미
# 떠 있어야 실제 트래픽이 정상 프록시된다. contract-test가 없어(TODO 참고) 배포 자체엔 선행조건이
# 없지만, 라우팅 대상과 함께 뜨도록 같은 wave에 둔다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/api-gateway
    helm:
      valueFiles:
        - values.yaml
        - values-ha.yaml  # HA 프로파일 활성화(2026-09-01 결정) — replicaCount=2/HPA minReplicas=2
        # values.amd64.yaml는 삭제함(2026-08-26) — CI(build-and-deploy.yml)가 platforms 지정
        # 없이 GitHub Actions 러너(ubuntu-latest=amd64) 기준으로만 빌드하므로 values.yaml의
        # image.tag가 이미 amd64 이미지다. amd64 오버라이드가 CI가 갱신한 정확한 sha 태그를
        # 빌드된 적 없는 옛 placeholder 태그로 덮어써 ImagePullBackOff를 냈던 게 원인이었다.
        # 이 차트는 values-secret가 없다(라우팅 전용, DB/시크릿 의존 없음).
  # 운영 서버 실제 배포 네임스페이스는 groovy-application이다(2026-09-01, 어플리케이션/
  # 모니터링 네임스페이스 분리 결정 — 멘토 피드백 반영). platform(mysql/kafka/redis)까지
  # 포함해 7개 Application이 여기로 통일되어야 서비스 간 short-name DNS가 계속 해석된다.
  # groovy-monitoring(observability)과의 상호 참조는 FQDN(<svc>.<ns>.svc.cluster.local)으로 처리.
  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
