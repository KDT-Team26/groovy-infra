apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: content-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: helm/content-service
    helm:
      valueFiles:
        - values.yaml
        - values-ha.yaml  # HA 프로파일 활성화(2026-09-01 결정) — replicaCount=2/HPA minReplicas=2

  destination:
    server: https://kubernetes.default.svc
    namespace: groovy-application
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
