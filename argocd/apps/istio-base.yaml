# Istio CRD/클러스터 롤 등 기반 리소스 설치용 ArgoCD Application
# istiod보다 반드시 먼저 떠야 해서 sync-wave를 가장 앞에 둔다.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: "1.30.4"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod가 기동하면서 istiod-default-validator 웹훅의 caBundle을 런타임에 직접 주입한다
  # 그래서 ArgoCD가 달라졌다고 판단을 하고 계속 싱크를 맞춰버림 (무한 알림 문제 유발)
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
