# Istio-컨트롤 플레인(istiod) 설치용 App
# 현재 상황 (일단 최소로 구성)
# 레플리카 셋 : 1개
# cpu: 100m
# memory: 256Mi
# limits:
#  cpu: 500m
#  memory: 512Mi

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: "1.30.4"
    helm:
      values: |
        replicaCount: 1
        autoscaleEnabled: false
        pilot:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        global:
          istioNamespace: istio-system
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
