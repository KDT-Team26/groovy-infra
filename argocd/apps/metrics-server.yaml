# metrics-server — HPA가 CPU/메모리 사용량 조회하는 metrics.k8s.io API 제공.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server

    targetRevision: "3.14.0"
    helm:
      values: |
        args:
          # minikube kubelet 인증서가 자체 서명이라 검증 실패함 — 운영 클러스터로 옮기면 이 옵션 제거해야 함
          - --kubelet-insecure-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
