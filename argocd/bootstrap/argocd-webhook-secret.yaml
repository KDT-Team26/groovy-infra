# ArgoCD 웹훅(#193 B안) — GitHub 이 보내는 push 이벤트 서명 검증용 시크릿.
#
# argocd-secret 은 ArgoCD 코어(install.yaml)가 admin.password/server.secretkey/tls.crt 등을
# 이미 담아 관리하는 기존 Secret 이다. creationPolicy: Owner 로 이 ExternalSecret 이 그 Secret을
# 통째로 소유해버리면 저 기존 키들이 사라진다 — 그래서 반드시 creationPolicy: Merge 로
# webhook.github.secret 키 하나만 병합한다.
#
# ⚠️ groovy/prod/argocd-webhook 시크릿(키: githubWebhookSecret)이 아직 Secrets Manager에 없다.
# 적용 전 팀에서 등록해야 한다:
#   aws secretsmanager create-secret --name groovy/prod/argocd-webhook \
#     --secret-string '{"githubWebhookSecret":"<openssl rand -hex 32 등으로 생성한 값>"}'
# 같은 값을 GitHub 레포 Webhook 설정의 Secret 필드에도 입력해야 서명이 일치한다
# (argocd/bootstrap/register-github-webhook.sh 참고).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: groovy/prod/argocd-webhook
        property: githubWebhookSecret
