# ArgoCD 웹훅(#193 B안) + ArgoCD UI 외부 접속용 Ingress.
#
# 이 레포의 GitOps 관리 대상(argocd/apps/*)이 아니라 install-argocd.sh 가 kubectl apply 로
# 직접 적용하는 부트스트랩 리소스다 — ci-readonly-rbac.yaml, external-secrets-clustersecretstore.yaml
# 과 같은 성격. argocd-server 자신을 ArgoCD Application 으로 등록하면 자기 자신을 관리하는
# 순환 구조가 되어 피한다.
#
# alb.ingress.kubernetes.io/group.name 을 helm/istio-gateway 의 Ingress(api.groovy-team26.com)와
# 동일하게 맞춰서, AWS Load Balancer Controller 가 두 Ingress 를 하나의 ALB 로 묶는다(IngressGroup).
# 즉 여기서 ALB 를 새로 만들지 않는다 — 반드시 helm/istio-gateway/values.yaml 의 albGroupName 을
# 먼저(또는 동시에) 설정해야 같은 ALB 로 묶인다. 적용 순서는 docs/argocd-webhook-setup.md 참고.
#
# argocd-server 는 기본적으로 자체 TLS(자체서명 인증서)로 8080 포트를 서빙한다 — ALB 가 TLS 를
# 종료하고 평문 HTTP 로 넘기는 이 패턴과 맞으려면 argocd-cm.yaml 의 server.insecure: "true" 가
# 먼저 적용되어 있어야 한다(안 그러면 TLS 핸드셰이크 실패로 502).
#
# ⚠️ certificate-arn 은 placeholder 다. terraform/dns.tf 에 argocd 서브도메인용 ACM 인증서를
# 추가한 뒤(DNS 검증 완료 후) 실제 ARN 으로 채워야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:665206375378:certificate/485e362a-8ad3-4bd7-b9be-8ab2975202e5"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # helm/istio-gateway/values.yaml 의 istioGateway.albGroupName 과 반드시 동일한 값.
    alb.ingress.kubernetes.io/group.name: "groovy-shared-alb"
spec:
  ingressClassName: alb
  rules:
    - host: "argocd.groovy-team26.com"
      http:
        paths:
          # GitHub push 웹훅 — argocd-secret 의 webhook.github.secret 으로 서명 검증.
          - path: /api/webhook
            pathType: Exact
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
          # ArgoCD UI/API — ArgoCD 자체 로그인(admin/SSO)으로 보호됨.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
