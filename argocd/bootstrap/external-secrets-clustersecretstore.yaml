# ESO(External Secrets Operator)가 AWS Secrets Manager를 바라보게 하는 클러스터 전역 SecretStore.
# 인증은 별도 auth 블록 없이 AWS SDK 기본 자격증명 체인을 쓴다 — external-secrets 컨트롤러의
# 서비스어카운트(external-secrets/external-secrets)에 연결된 EKS Pod Identity Association
# (역할: groovy-eso-secrets-role, groovy/* 시크릿 읽기 전용)이 자동으로 잡힌다.
#
# 적용: kubectl apply -f argocd/bootstrap/external-secrets-clustersecretstore.yaml
# (root-app.yaml/argocd/apps 대상이 아니라 sealed-secrets 컨트롤러처럼 부트스트랩 단계에서
# 직접 적용하는 클러스터 전역 리소스 — 각 서비스 차트의 ExternalSecret이 이 이름을 참조한다.)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
