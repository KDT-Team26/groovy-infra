# Discord Webhook URL — Sealed Secrets로 관리(이유/사용법은 helm/observability의
# alertmanager-secret.yaml과 동일: 평문을 절대 커밋하지 않고 이 클러스터의 공개키로 암호화한
# 값만 커밋한다).
#
# 단 이 파일은 Helm 차트 소속이 아니라 ArgoCD 자체(argocd 네임스페이스) bootstrap 리소스라
# .Values 템플릿 없이 정적 YAML로 작성했다 — argocd-rbac-cm.yaml/argocd-notifications-cm.yaml과
# 같은 이유로 install-argocd.sh가 kubectl apply로 직접 적용한다(root-app.yaml의 GitOps 관리
# 대상 아님).
#
# 값 채우는 법: argocd/bootstrap/seal-secret-values.sh 실행 → 출력되는
# "argocd-notifications-secret.yaml (encryptedData.discord-webhook-url)" 아래 값을
# 그대로 복사해서 아래 discord-webhook-url 자리에 붙여넣는다. Helm의 `required` 검증 같은
# 안전장치가 없는 정적 YAML이라, 값을 채우지 않으면 아래 플레이스홀더 문자열 그대로 적용되어
# SealedSecret 복호화 자체가 실패한다(의도된 동작 — 평문 없이 무심코 apply되는 것을 막는다).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  encryptedData:
    discord-webhook-url: 
  template:
    metadata:
      name: argocd-notifications-secret
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: argocd
    type: Opaque
