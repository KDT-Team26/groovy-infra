# ESO(External Secrets Operator)로 전환(1단계) — Discord Webhook URL.
#
# ⚠️ groovy/prod/argocd-notifications 시크릿(키: discordWebhookUrl)이 아직 Secrets Manager에
# 없다. 실제 Discord Webhook URL 값을 팀에서 등록해야 이 ExternalSecret이 정상 동기화된다:
#   aws secretsmanager create-secret --name groovy/prod/argocd-notifications \
#     --secret-string '{"discordWebhookUrl":"<실제 웹훅 URL>"}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: groovy/prod/argocd-notifications
        property: discordWebhookUrl
