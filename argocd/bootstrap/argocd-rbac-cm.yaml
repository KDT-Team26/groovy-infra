# GitOps 빌드 지시서 Phase 05 — ArgoCD RBAC 초기 정책.
# SSO/OIDC를 아직 붙이지 않았으므로(팀 전용 mini PC, 로컬 계정만 운영) 최소한만 분리해둔다.
# 기본값은 "권한 없으면 읽기 전용" — ArgoCD 내장 role:readonly/role:admin이 이미 합리적인 기본
# 권한을 갖고 있어(readonly: get만 허용, sync/delete/설정변경은 자동으로 거부) 별도 재정의는
# 필요 없다.
#
# 주의: 이 파일은 ArgoCD 자신이 GitOps(root-app.yaml)로 관리하는 대상이 아니다 — 설치 자체가
# 아직 안 끝난 부트스트랩 단계에 적용하는 것이라 ArgoCD가 스스로를 감시할 수 없다. 그래서
# install-argocd.sh가 이 파일을 kubectl apply로 직접 적용한다. 나중에 정책을 바꿀 땐 이 파일을
# 고치고 다시 아래 두 명령으로 반영한다(ConfigMap은 재시작해야 읽음):
#   kubectl apply -n argocd -f argocd/bootstrap/argocd-rbac-cm.yaml
#   kubectl rollout restart deployment argocd-server -n argocd
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  # 로그인은 했지만 policy.csv에 role이 안 잡힌 계정은 전부 읽기 전용으로 떨어진다.
  policy.default: role:readonly

  policy.csv: |
    # 내장 admin 계정(설치 시 자동 생성되는 argocd-initial-admin-secret)은 ArgoCD가 자체적으로
    # 전체 권한을 가지므로 여기 별도 g 규칙이 필요 없다.
    #
    # 팀원용 로컬 계정을 추가하는 절차(SSO 없는 소규모 팀 전제):
    #   1) argocd-cm ConfigMap에 accounts.<username>: apiKey,login 추가
    #   2) argocd-secret에 accounts.<username>.password 설정
    #      (`argocd account bcrypt --password <원문>`으로 해시를 만들어 넣는다)
    #   3) 아래에 role 매핑을 추가
    #
    # 예시 — 조회만 필요한 팀원(주석 해제 후 실제 계정명으로 교체):
    # g, alice, role:readonly
    #
    # 예시 — sync는 허용하되 삭제/설정변경은 막고 싶은 팀원이 생기면 커스텀 role을 새로 정의한다:
    # p, role:developer, applications, get,  */*, allow
    # p, role:developer, applications, sync, */*, allow
    # g, bob, role:developer
