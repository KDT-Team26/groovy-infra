# 아르고CD App of Apps 최상위 진입점.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: groovy-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KDT-Team26/groovy-infra.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
